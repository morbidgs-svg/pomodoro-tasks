  document.getElementById("addVendorBtn").addEventListener("click", addVendor);
  document.getElementById("searchBtn").addEventListener("click", openSearch);

  /* ────────── 업체 검색 ────────── */
  /* 숫자는 3,200 처럼 저장되므로 비교할 때 콤마를 없앱니다 */
  function plain(s) {
    return String(s == null ? "" : s).toLowerCase().replace(/,/g, "").replace(/\s+/g, " ");
  }
  function searchTokens(q) {
    return String(q || "").trim().toLowerCase().split(/\s+/).filter(Boolean);
  }

  /* 업체 하나가 가진 검색 대상 줄들 */
  function searchFields(m, mi, v, vi) {
    var fields = [
      { label: t("marketTag"), text: marketLabel(m, mi), head: true },
      { label: t("vendorName"), text: vendorLabel(v, vi), head: true }
    ];
    if (v.cardQr) fields.push({ label: t("qrLink"), text: v.cardQr });
    v.items.forEach(function (it, i) {
      if (isBlankItem(it)) return;
      var chip = t("itemChip", i + 1);
      if (String(it.price).trim()) fields.push({ label: chip + " · " + t("price"), text: it.price + " " + curSuffix(v.currency), item: it.id });
      if (String(it.moq).trim()) fields.push({ label: chip + " · " + t("moq"), text: it.moq + " " + t("moqUnit"), item: it.id });
      if (String(it.memo).trim()) fields.push({ label: chip + " · " + t("memo"), text: it.memo, item: it.id });
    });
    return fields;
  }

  function searchHits(query) {
    var toks = searchTokens(query);
    if (!toks.length) return [];
    var hits = [];
    state.markets.forEach(function (m, mi) {
      m.vendors.forEach(function (v, vi) {
        var fields = searchFields(m, mi, v, vi);
        var hay = plain(fields.map(function (f) { return f.text; }).join(" \n "));
        var all = toks.every(function (tk) { return hay.indexOf(plain(tk)) > -1; });
        if (!all) return;
        /* 시장·업체명은 제목 줄에 이미 나오므로 아래에는 진짜 내용만 보여준다 */
        var lines = fields.filter(function (f) {
          if (f.head) return false;
          return toks.some(function (tk) { return plain(f.text).indexOf(plain(tk)) > -1; });
        }).slice(0, 2);
        var thumb = v.cards && v.cards[0];
        if (!thumb) {
          for (var i = 0; i < v.items.length; i++) {
            if (v.items[i].photos && v.items[i].photos[0]) { thumb = v.items[i].photos[0]; break; }
          }
        }
        hits.push({
          mi: mi, vi: vi, toks: toks, lines: lines, thumb: thumb || null,
          market: marketLabel(m, mi), vendor: vendorLabel(v, vi)
        });
      });
    });
    return hits;
  }

  /* 맞은 부분을 표시해서 눈에 바로 띄게 한다 */
  function highlight(text, toks) {
    var src = String(text == null ? "" : text);
    var low = src.toLowerCase();
    var spans = [];
    toks.forEach(function (tk) {
      if (!tk) return;
      var i = low.indexOf(tk);
      if (i < 0 && /^[0-9]+$/.test(tk)) {
        /* 3200 으로 찾아도 3,200 에 표시되도록 */
        var re = new RegExp(tk.split("").join("[,\\s]?"), "g"), mm;
        while ((mm = re.exec(low))) spans.push([mm.index, mm.index + mm[0].length]);
        return;
      }
      while (i > -1) { spans.push([i, i + tk.length]); i = low.indexOf(tk, i + tk.length); }
    });
    if (!spans.length) return esc(src);
    spans.sort(function (a, b) { return a[0] - b[0]; });
    var out = "", pos = 0;
    spans.forEach(function (r) {
      if (r[0] < pos) return;
      out += esc(src.slice(pos, r[0])) + "<mark>" + esc(src.slice(r[0], r[1])) + "</mark>";
      pos = r[1];
    });
    return out + esc(src.slice(pos));
  }

  /* 메모가 길면 맞은 자리 주변만 잘라 보여준다 */
  function searchSnippet(text, toks) {
    var src = String(text == null ? "" : text).replace(/\s+/g, " ").trim();
    if (src.length <= 80) return src;
    var low = src.toLowerCase(), at = -1;
    toks.forEach(function (tk) {
      var i = low.indexOf(tk);
      if (i > -1 && (at < 0 || i < at)) at = i;
    });
    if (at < 30) return src.slice(0, 80) + "…";
    var start = at - 24;
    return "…" + src.slice(start, start + 80) + (start + 80 < src.length ? "…" : "");
  }

  function searchRow(h) {
    var thumb = h.thumb && urlCache[h.thumb]
      ? '<span class="hit-thumb"><img src="' + esc(urlCache[h.thumb]) + '" alt=""></span>'
      : '<span class="hit-thumb">📄</span>';
    var lines = h.lines.map(function (f) {
      return '<span class="hit-line"><span class="hit-label">' + esc(f.label) + '</span>' +
        highlight(searchSnippet(f.text, h.toks), h.toks) + '</span>';
    }).join("");
    var item = h.lines.length && h.lines[0].item ? ' data-hit-item="' + esc(h.lines[0].item) + '"' : "";
    return '<button class="hit" data-hit-market="' + h.mi + '" data-hit-vendor="' + h.vi + '"' + item + '>' +
      thumb +
      '<span class="hit-body">' +
        '<span class="hit-title">' + highlight(h.vendor, h.toks) + '</span>' +
        '<span class="hit-sub">🏬 ' + highlight(h.market, h.toks) + '</span>' +
        lines +
      '</span></button>';
  }

  function jumpToHit(mi, vi, itemId) {
    goToMarket(mi, vi).then(function () {
      if (!itemId) return;
      var el = document.querySelector('[data-item="' + itemId + '"]');
      if (!el) return;
      try { el.scrollIntoView({ behavior: "smooth", block: "center" }); }
      catch (e) { el.scrollIntoView(); }
      el.classList.add("flash");
      setTimeout(function () { el.classList.remove("flash"); }, 1500);
    });
  }

  function openSearch() {
    var back = document.createElement("div");
    back.className = "search-back";
    back.innerHTML =
      '<div class="search-bar">' +
        '<input class="search-input" type="search" placeholder="' + esc(t("searchPlaceholder")) + '" autocomplete="off">' +
        '<button class="search-cancel" data-close="1">' + esc(t("cancel")) + '</button>' +
      '</div>' +
      '<div class="search-body"></div>';

    var input = back.querySelector(".search-input");
    var body = back.querySelector(".search-body");
    var seq = 0;

    function msg(text) { body.innerHTML = '<p class="search-msg">' + esc(text) + '</p>'; }
    msg(t("searchHint"));

    function update() {
      var mine = ++seq;
      var toks = searchTokens(input.value);
      if (!toks.length) { msg(t("searchHint")); return; }
      var hits = searchHits(input.value);
      if (!hits.length) { msg(t("searchNone")); return; }
      var ids = hits.map(function (h) { return h.thumb; }).filter(Boolean);
      ensureURLs(ids).then(function () {
        if (mine !== seq) return;   /* 빨리 치는 동안 지난 결과가 덮어쓰지 않도록 */
        body.innerHTML = '<p class="search-msg">' + esc(t("searchCount", hits.length)) + '</p>' +
          hits.map(searchRow).join("");
      });
    }

    function close() {
      back.remove();
      document.body.classList.remove("has-overlay");
      document.removeEventListener("keydown", onKey);
    }
    function onKey(e) { if (e.key === "Escape") close(); }

    input.addEventListener("input", update);
    back.addEventListener("click", function (e) {
      if (e.target.closest("[data-close]")) { close(); return; }
      var hit = e.target.closest("[data-hit-vendor]");
      if (!hit) return;
      close();
      jumpToHit(parseInt(hit.dataset.hitMarket, 10), parseInt(hit.dataset.hitVendor, 10), hit.dataset.hitItem || null);
    });
    document.addEventListener("keydown", onKey);
    document.body.classList.add("has-overlay");
    document.body.appendChild(back);
    input.focus();
  }


  /* ────────── 위치 · 지나온 길 ────────── */
  /* 시장 건물 안에서는 GPS 오차가 커서(10~50m) 정확한 통로까지는 못 잡는다.
     "건물 어느 쪽이었나, 어디까지 돌았나" 정도로 쓰는 기능이다. */
  var TRACK_MAX = 3000;
  var geoWatchId = null;
  var geoLast = null;
  var geoOnMove = null;

  function geoOk() { return !!(navigator.geolocation && navigator.geolocation.getCurrentPosition); }
  function geoMsg(err) { return (err && err.code === 1) ? t("geoDenied") : t("geoNo"); }
  function toPos(p) {
    return { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy || 0), t: Date.now() };
  }
  function geoOnce() {
    return new Promise(function (resolve, reject) {
      if (!geoOk()) { reject(null); return; }
      navigator.geolocation.getCurrentPosition(function (p) {
        geoLast = toPos(p);
        resolve(geoLast);
      }, reject, { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 });
    });
  }

  function metersBetween(a, b) {
    var R = 6371000, rad = Math.PI / 180;
    var dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  }
  function bearingOf(a, b) {
    var rad = Math.PI / 180;
    var y = Math.sin((b.lng - a.lng) * rad) * Math.cos(b.lat * rad);
    var x = Math.cos(a.lat * rad) * Math.sin(b.lat * rad) -
            Math.sin(a.lat * rad) * Math.cos(b.lat * rad) * Math.cos((b.lng - a.lng) * rad);
    return (Math.atan2(y, x) / rad + 360) % 360;
  }
  function distText(m) { return m < 1000 ? Math.round(m) + "m" : (m / 1000).toFixed(1) + "km"; }
  function dirText(deg) {
    var dirs = t("mapDirs");
    return dirs[Math.round(deg / 45) % 8];
  }

  function trackPush(pos) {
    var m = market();
    if (!m) return false;
    if (!Array.isArray(m.track)) m.track = [];
    var last = m.track[m.track.length - 1];
    /* 제자리에 서 있을 때는 점을 쌓지 않는다 */
    if (last && metersBetween({ lat: last[1], lng: last[2] }, pos) < 4 && pos.t - last[0] < 15000) return false;
    m.track.push([pos.t, +pos.lat.toFixed(6), +pos.lng.toFixed(6), pos.acc]);
    if (m.track.length > TRACK_MAX) m.track.splice(0, m.track.length - TRACK_MAX);
    save();
    return true;
  }

  function tracking() { return geoWatchId !== null; }
  function paintTrackPill() {
    var pill = document.getElementById("trackPill");
    if (!pill) return;
    pill.querySelector("span").textContent = t("trackPill");
    pill.classList.toggle("hidden", !tracking());
  }
  function trackStop() {
    if (geoWatchId !== null) {
      try { navigator.geolocation.clearWatch(geoWatchId); } catch (e) {}
    }
    geoWatchId = null;
    paintTrackPill();
  }
  function trackStart() {
    if (!geoOk()) { toast(t("geoNo")); return false; }
    if (tracking()) return true;
    geoWatchId = navigator.geolocation.watchPosition(function (p) {
      geoLast = toPos(p);
      trackPush(geoLast);
      if (geoOnMove) geoOnMove();
    }, function (err) {
      trackStop();
      toast(geoMsg(err));
      if (geoOnMove) geoOnMove();
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 3000 });
    paintTrackPill();
    return true;
  }

  document.getElementById("trackPill").addEventListener("click", function () { openMap(); });

  /* 새 업체를 만들 때 기록 중이면 그 자리를 같이 남겨둔다 */
  function stampVendor(v, pos) {
    if (!v || !pos) return;
    v.pos = { lat: pos.lat, lng: pos.lng, acc: pos.acc, t: pos.t };
  }

  function openInMapApp(pos, label) {
    if (!pos) return;
    var ios = /iPad|iPhone|iPod/.test(navigator.userAgent || "");
    var url = ios
      ? "https://maps.apple.com/?ll=" + pos.lat + "," + pos.lng + "&q=" + encodeURIComponent(label || "")
      : "geo:" + pos.lat + "," + pos.lng + "?q=" + pos.lat + "," + pos.lng + "(" + encodeURIComponent(label || "") + ")";
    var a = document.createElement("a");
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function openMap() {
    var back = document.createElement("div");
    back.className = "map-back";
    back.innerHTML =
      '<div class="map-bar">' +
        '<button class="mini" data-shut="1">' + esc(t("close")) + '</button>' +
        '<div class="map-title"></div>' +
        '<button class="mini" data-clear="1">' + esc(t("mapClear")) + '</button>' +
      '</div>' +
      '<div class="map-wrap"><canvas></canvas>' +
        '<div class="map-msg" hidden></div>' +
        '<div class="map-note">' + esc(t("mapIndoor")) + '</div>' +
      '</div>' +
      '<div class="map-foot">' +
        '<button data-track="1"></button>' +
        '<button data-here="1">' + esc(t("trackHere")) + '</button>' +
        '<button data-open="1">' + esc(t("mapOpen")) + '</button>' +
      '</div>';

    var wrap = back.querySelector(".map-wrap");
    var canvas = back.querySelector("canvas");
    var msg = back.querySelector(".map-msg");
    var title = back.querySelector(".map-title");
    var trackBtn = back.querySelector("[data-track]");
    var pins = [];

    function paintButtons() {
      trackBtn.textContent = tracking() ? t("trackStop") : t("trackStart");
      trackBtn.className = tracking() ? "on" : "";
      var m = market();
      var v = vendor();
      var line = marketLabel(m, state.currentMarket);
      if (geoLast && v && v.pos) {
        line += " · " + t("mapDist", distText(metersBetween(geoLast, v.pos)), dirText(bearingOf(geoLast, v.pos)));
      }
      title.textContent = line;
    }

    function draw() {
      var m = market();
      var dpr = window.devicePixelRatio || 1;
      var W = wrap.clientWidth, H = wrap.clientHeight;
      if (!W || !H) return;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      var g = canvas.getContext("2d");
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, W, H);
      pins = [];

      var track = Array.isArray(m.track) ? m.track : [];
      var spots = [];
      m.vendors.forEach(function (v, i) { if (v.pos) spots.push({ v: v, i: i }); });

      var all = track.map(function (p) { return { lat: p[1], lng: p[2] }; });
      spots.forEach(function (sp) { all.push({ lat: sp.v.pos.lat, lng: sp.v.pos.lng }); });
      if (geoLast) all.push(geoLast);
      if (!all.length) {
        msg.textContent = t("mapEmpty");
        msg.hidden = false;
        return;
      }
      msg.hidden = true;

      var lat0 = 0, lng0 = 0;
      all.forEach(function (p) { lat0 += p.lat; lng0 += p.lng; });
      lat0 /= all.length; lng0 /= all.length;
      var mLat = 111320, mLng = 111320 * Math.cos(lat0 * Math.PI / 180);
      function flat(p) { return { x: (p.lng - lng0) * mLng, y: -(p.lat - lat0) * mLat }; }

      var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
      all.forEach(function (p) {
        var q = flat(p);
        if (q.x < minX) minX = q.x;
        if (q.x > maxX) maxX = q.x;
        if (q.y < minY) minY = q.y;
        if (q.y > maxY) maxY = q.y;
      });
      var span = Math.max(maxX - minX, maxY - minY, 30);        /* 너무 좁으면 최소 30m 폭 */
      var pad = 56;
      var scale = (Math.min(W, H) - pad * 2) / span;
      var cx = W / 2 - ((minX + maxX) / 2) * scale;
      var cy = H / 2 - ((minY + maxY) / 2) * scale;
      function pt(p) { var q = flat(p); return { x: cx + q.x * scale, y: cy + q.y * scale }; }

      /* 지나온 길 */
      if (track.length > 1) {
        g.strokeStyle = "#c9c3b8";
        g.lineWidth = 5;
        g.lineJoin = "round";
        g.lineCap = "round";
        g.beginPath();
        track.forEach(function (p, i) {
          var q = pt({ lat: p[1], lng: p[2] });
          if (i === 0) g.moveTo(q.x, q.y); else g.lineTo(q.x, q.y);
        });
        g.stroke();
        /* 최근 30분은 진하게 */
        var recent = track.filter(function (p) { return Date.now() - p[0] < 1800000; });
        if (recent.length > 1) {
          g.strokeStyle = "#e2634f";
          g.lineWidth = 3;
          g.beginPath();
          recent.forEach(function (p, i) {
            var q = pt({ lat: p[1], lng: p[2] });
            if (i === 0) g.moveTo(q.x, q.y); else g.lineTo(q.x, q.y);
          });
          g.stroke();
        }
      }

      /* 업체 자리. GPS 오차로 여러 곳이 한 점에 겹치면 서로 살짝 밀어내 전부 보이게 한다 */
      var placed = [];
      function spread(q) {
        var base = { x: q.x, y: q.y }, n = 0;
        while (n < 14) {
          var hit = false;
          for (var k = 0; k < placed.length; k++) {
            var dx = placed[k].x - q.x, dy = placed[k].y - q.y;
            if (Math.sqrt(dx * dx + dy * dy) < 28) { hit = true; break; }
          }
          if (!hit) break;
          var ang = n * 1.2;
          var rad = 22 + n * 4;
          q = { x: base.x + Math.cos(ang) * rad, y: base.y + Math.sin(ang) * rad };
          n++;
        }
        placed.push(q);
        return q;
      }

      spots.forEach(function (sp) {
        var q = spread(pt(sp.v.pos));
        var here = sp.i === state.current;
        pins.push({ x: q.x, y: q.y, i: sp.i });
        g.beginPath();
        g.arc(q.x, q.y, here ? 16 : 13, 0, Math.PI * 2);
        g.fillStyle = here ? "#e2634f" : "#ffffff";
        g.fill();
        g.lineWidth = 2;
        g.strokeStyle = here ? "#e2634f" : "#8a8580";
        g.stroke();
        g.fillStyle = here ? "#ffffff" : "#2b2b2b";
        g.font = "bold 13px -apple-system, system-ui, sans-serif";
        g.textAlign = "center";
        g.textBaseline = "middle";
        g.fillText(String(sp.i + 1), q.x, q.y + 1);
        var name = vendorLabel(sp.v, sp.i);
        if (name.length > 9) name = name.slice(0, 8) + "…";
        g.font = "600 11px -apple-system, system-ui, sans-serif";
        g.textBaseline = "top";
        g.lineWidth = 3;
        g.strokeStyle = "#f5f3ef";
        g.strokeText(name, q.x, q.y + (here ? 19 : 16));
        g.fillStyle = "#6b6660";
        g.fillText(name, q.x, q.y + (here ? 19 : 16));
      });

      /* 지금 내 자리 */
      if (geoLast) {
        var me = pt(geoLast);
        var rAcc = Math.max(6, Math.min(geoLast.acc * scale, Math.min(W, H) / 2));
        g.beginPath();
        g.arc(me.x, me.y, rAcc, 0, Math.PI * 2);
        g.fillStyle = "rgba(60,120,220,0.12)";
        g.fill();
        g.beginPath();
        g.arc(me.x, me.y, 8, 0, Math.PI * 2);
        g.fillStyle = "#3c78dc";
        g.fill();
        g.lineWidth = 3;
        g.strokeStyle = "#ffffff";
        g.stroke();
      }

      /* 축척 · 북쪽 */
      var barM = 50, barPx = barM * scale;
      while (barPx > W * 0.45) { barM /= 2; barPx = barM * scale; }
      while (barPx < W * 0.15) { barM *= 2; barPx = barM * scale; }
      g.strokeStyle = "#8a8580";
      g.lineWidth = 2;
      g.beginPath();
      g.moveTo(16, H - 24); g.lineTo(16 + barPx, H - 24);
      g.moveTo(16, H - 29); g.lineTo(16, H - 19);
      g.moveTo(16 + barPx, H - 29); g.lineTo(16 + barPx, H - 19);
      g.stroke();
      g.fillStyle = "#8a8580";
      g.font = "600 11px -apple-system, system-ui, sans-serif";
      g.textAlign = "left";
      g.textBaseline = "bottom";
      g.fillText(distText(barM), 16, H - 30);
      g.textAlign = "center";
      g.font = "bold 13px -apple-system, system-ui, sans-serif";
      g.fillText("N", W - 24, 30);
      g.beginPath();
      g.moveTo(W - 24, 12); g.lineTo(W - 29, 22); g.lineTo(W - 19, 22);
      g.closePath();
      g.fillStyle = "#8a8580";
      g.fill();
    }

    function redraw() { paintButtons(); draw(); }

    function close() {
      geoOnMove = null;
      window.removeEventListener("resize", redraw);
      document.removeEventListener("keydown", onKey);
      document.body.classList.remove("has-overlay");
      back.remove();
    }
    function onKey(e) { if (e.key === "Escape") close(); }

    back.addEventListener("click", function (e) {
      if (e.target.closest("[data-shut]")) { close(); return; }
      if (e.target.closest("[data-clear]")) {
        confirmDialog(t("mapClearAsk")).then(function (ok) {
          if (!ok) return;
          market().track = [];
          save();
          redraw();
        });
        return;
      }
      if (e.target.closest("[data-track]")) {
        if (tracking()) { trackStop(); toast(t("trackOff")); }
        else if (trackStart()) { toast(t("trackOn")); }
        redraw();
        return;
      }
      if (e.target.closest("[data-here]")) {
        var mark = function (pos) {
          stampVendor(vendor(), pos);
          trackPush(pos);
          save();
          toast(t("mapHereDone"));
          redraw();
        };
        if (geoLast && Date.now() - geoLast.t < 20000) { mark(geoLast); return; }
        toast(t("geoWait"));
        geoOnce().then(mark)["catch"](function (err) { toast(geoMsg(err)); });
        return;
      }
      if (e.target.closest("[data-open]")) {
        var v = vendor();
        var spot = (v && v.pos) || geoLast;
        if (!spot) { toast(t("mapEmpty").split("\n")[0]); return; }
        openInMapApp(spot, v && v.pos ? vendorLabel(v, state.current) : t("mapMe"));
        return;
      }
      /* 지도에서 업체를 누르면 그 업체로 */
      var box = canvas.getBoundingClientRect();
      var x = e.clientX - box.left, y = e.clientY - box.top;
      for (var i = 0; i < pins.length; i++) {
        var d = Math.sqrt(Math.pow(pins[i].x - x, 2) + Math.pow(pins[i].y - y, 2));
        if (d <= 24) { close(); goTo(pins[i].i); return; }
      }
    });

    geoOnMove = redraw;
    window.addEventListener("resize", redraw);
    document.addEventListener("keydown", onKey);
    document.body.classList.add("has-overlay");
    document.body.appendChild(back);
    redraw();

    /* 기록 중이 아니어도 지금 자리는 한 번 찍어서 보여준다 */
    if (!tracking() && geoOk()) {
      geoOnce().then(redraw)["catch"](function () {});
    }
  }


  /* ────────── 앱처럼 쓰기 (홈 화면 추가 · 오프라인) ────────── */
  var installPrompt = null;
  var swReg = null;

  function standalone() {
    return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) ||
           navigator.standalone === true;
  }
  function isIos() { return /iPad|iPhone|iPod/.test(navigator.userAgent || ""); }
  function canInstall() { return !standalone(); }

  function doInstall() {
    if (installPrompt) {
      var p = installPrompt;
      installPrompt = null;
      p.prompt();
      if (p.userChoice && p.userChoice.then) {
        p.userChoice.then(function (r) {
          if (r && r.outcome === "accepted") toast(t("installDone"));
        });
      }
      return;
    }
    confirmDialog(isIos() ? t("installIos") : t("installOther"), t("okBtn"));
  }

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    installPrompt = e;
  });
  window.addEventListener("appinstalled", function () {
    installPrompt = null;
    toast(t("installDone"));
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (reg) {
        swReg = reg;
        /* 처음 담아두기가 끝나면 한 번만 알려준다 */
        if (!navigator.serviceWorker.controller) {
          navigator.serviceWorker.addEventListener("controllerchange", function () {
            if (!sessionStorage.getItem("offline-told")) {
              try { sessionStorage.setItem("offline-told", "1"); } catch (e) {}
              toast(t("offlineReady"));
            }
          });
        }
        reg.addEventListener("updatefound", function () {
          var sw = reg.installing;
          if (!sw) return;
          sw.addEventListener("statechange", function () {
            if (sw.state === "installed" && navigator.serviceWorker.controller) toast(t("updateReady"));
          });
        });
      })["catch"](function () {});
    });
  }

  /* ────────── 메뉴 ────────── */
  document.getElementById("menuBtn").addEventListener("click", function () {
    var marketList = state.markets.map(function (m, i) {
      return '<div class="sheet-row">' +
        '<button class="sheet-item' + (i === state.currentMarket ? " active" : "") + '" data-market="' + i + '">' +
          '<span class="grow">🏬 ' + esc(marketLabel(m, i)) + '</span>' +
          '<span class="sub">' + esc(t("vendorCount", m.vendors.length)) + '</span></button>' +
        '<button class="row-del" data-del-market="' + i + '" aria-label="' + esc(t("delMarketAria")) + '">🗑</button>' +
        '</div>';
    }).join("");

    var list = vendors().map(function (v, i) {
      return '<div class="sheet-row">' +
        '<button class="sheet-item' + (i === state.current ? " active" : "") + '" data-go="' + i + '">' +
          '<span class="grow">' + (i + 1) + ". " + esc(vendorLabel(v, i)) + '</span>' +
          '<span class="sub">' + esc(t("itemCount", filledItems(v).length)) + '</span></button>' +
        '<button class="row-del" data-del-vendor="' + i + '" aria-label="' + esc(t("delVendorAria")) + '">🗑</button>' +
        '</div>';
    }).join("");

    var back = document.createElement("div");
    back.className = "backdrop";

  function runAction(act) {
    if (act === "add") {
      addVendor();

      state.markets.push(newMarket());
      goToMarket(state.markets.length - 1);
      toast(t("marketAdded"));
    } else if (act === "transServer") {
      askText(t("transServerAsk"), state.transUrl || "", "https://...").then(function (url) {
        if (url === null) return;
        state.transUrl = url;
        transCache = {};
        save();
        toast(t("transServerSaved"));
      });
    } else if (act === "install") {
      doInstall();
    } else if (act === "map") {
      openMap();
    } else if (act === "talk") {
      openTranslator();
    } else if (act === "search") {
      openSearch();
    } else if (act === "copy") {
      copyText();
    } else if (act === "excel") {
      exportExcel();
    } else if (act === "backup") {
      backup();
    } else if (act === "restore") {
      document.getElementById("fileRestore").click();
    } else if (act === "lang") {
      openLangSheet();
    } else if (act === "delVendor") {
      deleteVendor(state.current);
    } else if (act === "delMarket") {
      deleteMarket(state.currentMarket);
    }
  }

    var list = vendors();

    confirmDialog(t("delVendorAsk", vendorLabel(v, index))).then(function (ok) {
      if (!ok) return;
      dropVendorPhotos(v);
      list.splice(index, 1);
      if (!list.length) list.push(newVendor());
      goTo(state.current > index ? state.current - 1 : Math.min(state.current, list.length - 1));
      toast(t("vendorDeleted"));
    });
  }

  function deleteMarket(index) {
    var m = state.markets[index];
    if (!m) return;
    confirmDialog(t("delMarketAsk", marketLabel(m, index), m.vendors.length)).then(function (ok) {
      if (!ok) return;
      m.vendors.forEach(dropVendorPhotos);
      state.markets.splice(index, 1);
      if (!state.markets.length) state.markets.push(newMarket());
      var next = state.currentMarket > index ? state.currentMarket - 1 : Math.min(state.currentMarket, state.markets.length - 1);
      goToMarket(next);
      toast(t("marketDeleted"));

      var blob = new Blob([JSON.stringify(payload)], { type: "application/json" });

  document.getElementById("fileRestore").addEventListener("change", function () {
    var file = this.files && this.files[0];

    confirmDialog(t("restoreAsk"), t("confirmRestore")).then(function (ok) {
      if (!ok) return;
      var reader = new FileReader();
      reader.onload = function () {
        var payload;
        try { payload = JSON.parse(reader.result); } catch (e) { toast(t("unreadableFile")); return; }
        var restored = payload && payload.state ? migrate(payload.state) : null;
        if (!restored) { toast(t("badFile")); return; }
        Object.keys(urlCache).forEach(function (id) { URL.revokeObjectURL(urlCache[id]); delete urlCache[id]; });
        var images = payload.images || {};
        Promise.all(Object.keys(images).map(function (id) {
          return dbPut("images", id, dataURLtoBlob(images[id]));
        })).then(function () {
          state = normalize(restored);
          state.lang = lang;            /* 화면 언어 설정은 지금 쓰던 것을 유지한다 */
          state.talk = talk;
          save();
          return render();
        }).then(function () { toast(t("restored")); window.scrollTo(0, 0); })
        ["catch"](function () { toast(t("restoreFailed")); });

      reader.readAsText(file);
    });
  });

  /* ────────── 엑셀(XLSX) 내보내기 ────────── */
  var EMU_PER_PX = 9525;
  var PIC_BOX = { w: 226, h: 96 };      // 한 칸에 들어갈 사진 영역(px)
  var PIC_MAX = 3;                      // 한 칸에 넣을 사진 최대 장수
  var PIC_ROW_HEIGHT = 78;              // 사진이 있을 때 행 높이(pt)

  var crcTable = (function () {
    var table = [], c, n, k;
    for (n = 0; n < 256; n++) {
      c = n;
      for (k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      table[n] = c >>> 0;
    }
    return table;
  })();
  function crc32(bytes) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) c = crcTable[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function utf8(str) { return new TextEncoder().encode(str); }
  function xmlEsc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "");
  }

  /* 무압축(store) ZIP 작성기 — xlsx는 zip 컨테이너 */
  function zipBlob(files) {
    var now = new Date();
    var dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
    var dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
    var parts = [], central = [], offset = 0, count = 0, centralSize = 0;

    files.forEach(function (f) {
      var name = utf8(f.name);
      var data = f.data;
      var crc = crc32(data);

      var local = new Uint8Array(30 + name.length);
      var lv = new DataView(local.buffer);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 0x0800, true);
      lv.setUint16(8, 0, true);
      lv.setUint16(10, dosTime, true);
      lv.setUint16(12, dosDate, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, data.length, true);
      lv.setUint32(22, data.length, true);
      lv.setUint16(26, name.length, true);
      local.set(name, 30);

      var cen = new Uint8Array(46 + name.length);
      var cv = new DataView(cen.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, dosTime, true);
      cv.setUint16(14, dosDate, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, data.length, true);
      cv.setUint32(24, data.length, true);
      cv.setUint16(28, name.length, true);
      cv.setUint32(42, offset, true);
      cen.set(name, 46);

      parts.push(local, data);
      central.push(cen);
      offset += local.length + data.length;
      centralSize += cen.length;
      count++;
    });

    var end = new Uint8Array(22);
    var ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, count, true);
    ev.setUint16(10, count, true);
    ev.setUint32(12, centralSize, true);
    ev.setUint32(16, offset, true);

    return new Blob(parts.concat(central, [end]), {
      type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    });
  }

  function blobBytes(blob) {
    if (blob.arrayBuffer) {
      return blob.arrayBuffer().then(function (ab) { return new Uint8Array(ab); });
    }
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(new Uint8Array(r.result)); };
      r.onerror = function () { reject(r.error); };
      r.readAsArrayBuffer(blob);
    });
  }

  /* 엑셀에 넣을 축소본 만들기 (원본을 그대로 넣으면 파일이 너무 커짐) */
  function makeThumb(blob) {
    return loadBitmap(blob).then(function (src) {
      var w = src.width || src.naturalWidth;
      var h = src.height || src.naturalHeight;
      var scale = Math.min(1, 420 / Math.max(w, h));
      var cw = Math.max(1, Math.round(w * scale));
      var ch = Math.max(1, Math.round(h * scale));
      var canvas = document.createElement("canvas");
      canvas.width = cw; canvas.height = ch;
      canvas.getContext("2d").drawImage(src, 0, 0, cw, ch);
      if (src.close) src.close();
      return new Promise(function (resolve) {
        if (canvas.toBlob) canvas.toBlob(function (b) { resolve(b || dataURLtoBlob(canvas.toDataURL("image/jpeg", 0.8))); }, "image/jpeg", 0.8);
        else resolve(dataURLtoBlob(canvas.toDataURL("image/jpeg", 0.8)));
      }).then(blobBytes).then(function (bytes) {
        return { bytes: bytes, w: cw, h: ch };
      });
    });
  }

  function colLetter(index) {
    var s = "", i = index;
    do { s = String.fromCharCode(65 + (i % 26)) + s; i = Math.floor(i / 26) - 1; } while (i >= 0);
    return s;
  }
  function cellStr(col, row, text, style) {
    var ref = colLetter(col) + row;
    if (text == null || text === "") return '<c r="' + ref + '" s="' + style + '"/>';
    return '<c r="' + ref + '" t="inlineStr" s="' + style + '"><is><t xml:space="preserve">' + xmlEsc(text) + '</t></is></c>';
  }
  function cellNum(col, row, value, style) {
    return '<c r="' + colLetter(col) + row + '" s="' + style + '"><v>' + value + '</v></c>';
  }
  /* "1,234" 처럼 입력된 값은 숫자 셀로, 그 외에는 글자 셀로 */
  function numericCell(col, row, raw, numStyle, textStyle) {
    var text = String(raw == null ? "" : raw).trim();
    if (!text) return cellStr(col, row, "", numStyle);
    var stripped = text.replace(/,/g, "");
    if (/^\d+(\.\d+)?$/.test(stripped)) return cellNum(col, row, stripped, numStyle);
    return cellStr(col, row, text, textStyle);
  }

  function xlsxHeaders() { return t("xlsxHeaders"); }
  var XLSX_WIDTHS = [18, 9, 24, 12, 34, 38, 9, 34, 14, 12, 46];
  var COL_CARD = 4, COL_PHOTO = 7;      // 명함 / 물건 사진이 들어갈 열 (0-based)

  function sheetXML(rows, rowHeight, hasDrawing) {
    var x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"' +
      ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<sheetViews><sheetView tabSelected="1" workbookViewId="0">' +
      '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>' +
      '</sheetView></sheetViews>' +
      '<sheetFormatPr defaultRowHeight="16.5"/><cols>';
    XLSX_WIDTHS.forEach(function (w, i) {
      x += '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>';
    });
    x += '</cols><sheetData><row r="1" ht="28" customHeight="1">';
    xlsxHeaders().forEach(function (h, i) { x += cellStr(i, 1, h, 1); });
    x += '</row>';

    rows.forEach(function (row, i) {
      var r = i + 2;
      x += '<row r="' + r + '" ht="' + rowHeight + '" customHeight="1">' +
        cellStr(0, r, row.market, 4) +
        cellNum(1, r, row.vendorNo, 2) +
        cellStr(2, r, row.vendorName, 4) +
        cellStr(3, r, row.currency, 2) +
        cellStr(4, r, "", 2) +
        cellStr(5, r, row.qr, 4) +
        (row.itemNo ? cellNum(6, r, row.itemNo, 2) : cellStr(6, r, "", 2)) +
        cellStr(7, r, "", 2) +
        numericCell(8, r, row.price, 3, 2) +
        numericCell(9, r, row.moq, 3, 2) +
        cellStr(10, r, row.memo, 4) +
        '</row>';
    });

    x += '</sheetData><autoFilter ref="A1:' + colLetter(xlsxHeaders().length - 1) + (rows.length + 1) + '"/>';
    if (hasDrawing) x += '<drawing r:id="rId1"/>';
    return x + '</worksheet>';
  }

  function drawingXML(pics) {
    var x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing"' +
      ' xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"' +
      ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">';
    pics.forEach(function (p, i) {
      /* 같은 칸에 여러 장이면 가로로 나눠 배치 */
      var slots = Math.min(p.of || 1, PIC_MAX);
      var boxW = (PIC_BOX.w / slots) - (slots > 1 ? 6 : 0);
      var scale = Math.min(boxW / p.thumb.w, PIC_BOX.h / p.thumb.h, 1);
      var cx = Math.round(p.thumb.w * scale * EMU_PER_PX);
      var cy = Math.round(p.thumb.h * scale * EMU_PER_PX);
      var offX = Math.round((38100 + (p.slot || 0) * (boxW + 6) * EMU_PER_PX));
      x += '<xdr:oneCellAnchor>' +
        '<xdr:from><xdr:col>' + p.col + '</xdr:col><xdr:colOff>' + offX + '</xdr:colOff>' +
        '<xdr:row>' + p.row + '</xdr:row><xdr:rowOff>38100</xdr:rowOff></xdr:from>' +
        '<xdr:ext cx="' + cx + '" cy="' + cy + '"/>' +
        '<xdr:pic><xdr:nvPicPr><xdr:cNvPr id="' + (i + 2) + '" name="사진 ' + (i + 1) + '"/>' +
        '<xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr>' +
        '<xdr:blipFill><a:blip r:embed="rId' + (i + 1) + '"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill>' +
        '<xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="' + cx + '" cy="' + cy + '"/></a:xfrm>' +
        '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr>' +
        '</xdr:pic><xdr:clientData/></xdr:oneCellAnchor>';
    });
    return x + '</xdr:wsDr>';
  }

  function exportExcel() {
    var rows = [], picJobs = [];
    state.markets.forEach(function (m, mi) {
      m.vendors.forEach(function (v, vi) {
        var items = filledItems(v);
        if (!items.length) items = [null];      // 물건이 하나도 없으면 업체 줄만 남김
        items.forEach(function (it, ii) {
          rows.push({
            market: marketLabel(m, mi),
            vendorNo: vi + 1,
            vendorName: vendorLabel(v, vi),
            currency: curLabel(v.currency),
            qr: ii === 0 ? (v.cardQr || "") : "",
            itemNo: it ? ii + 1 : 0,
            price: it ? it.price : "",
            moq: it ? it.moq : "",
            memo: it ? it.memo : ""
          });
          var rowIndex = rows.length;                // 헤더가 1행이므로 0-based 행 = rows.length
          var addPics = function (list, col) {
            (list || []).slice(0, PIC_MAX).forEach(function (id, n) {
              picJobs.push({ row: rowIndex, col: col, id: id, slot: n, of: Math.min(list.length, PIC_MAX) });
            });
          };
          if (ii === 0) addPics(v.cards, COL_CARD);
          if (it) addPics(it.photos, COL_PHOTO);
        });
      });
    });

    if (!rows.length) { toast(t("nothingToExport")); return; }
    toast(t("xlsxMaking"));

    return Promise.all(picJobs.map(function (job) {
      return dbGet("images", job.id).then(function (blob) {
        if (!blob) return null;
        return makeThumb(blob).then(function (thumb) { job.thumb = thumb; return job; });
      })["catch"](function () { return null; });
    })).then(function (result) {
      var pics = result.filter(Boolean);
      var files = [];

      var contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
        '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
        '<Default Extension="xml" ContentType="application/xml"/>' +
        '<Default Extension="jpeg" ContentType="image/jpeg"/>' +
        '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
        '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
        '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
        (pics.length ? '<Override PartName="/xl/drawings/drawing1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>' : "") +
        '</Types>';

      var rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
        '</Relationships>';

      var workbook = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"' +
        ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
        '<sheets><sheet name="' + xmlEsc(t("sheetName")) + '" sheetId="1" r:id="rId1"/></sheets></workbook>';

      var workbookRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
        '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
        '</Relationships>';

      files.push({ name: "[Content_Types].xml", data: utf8(contentTypes) });
      files.push({ name: "_rels/.rels", data: utf8(rootRels) });
      files.push({ name: "xl/workbook.xml", data: utf8(workbook) });
      files.push({ name: "xl/_rels/workbook.xml.rels", data: utf8(workbookRels) });
      files.push({ name: "xl/styles.xml", data: utf8(stylesXML()) });
      files.push({ name: "xl/worksheets/sheet1.xml", data: utf8(sheetXML(rows, pics.length ? PIC_ROW_HEIGHT : 22, pics.length > 0)) });

      if (pics.length) {
        var sheetRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
          '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
          '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing1.xml"/>' +
          '</Relationships>';
        var drawingRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
          '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
          pics.map(function (p, i) {
            return '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/image' + (i + 1) + '.jpeg"/>';
          }).join("") + '</Relationships>';

        files.push({ name: "xl/worksheets/_rels/sheet1.xml.rels", data: utf8(sheetRels) });
        files.push({ name: "xl/drawings/drawing1.xml", data: utf8(drawingXML(pics)) });
        files.push({ name: "xl/drawings/_rels/drawing1.xml.rels", data: utf8(drawingRels) });
        pics.forEach(function (p, i) {
          files.push({ name: "xl/media/image" + (i + 1) + ".jpeg", data: p.thumb.bytes });
        });
      }

      var blob = zipBlob(files);
      var d = new Date();
      var stamp = d.getFullYear() + ("0" + (d.getMonth() + 1)).slice(-2) + ("0" + d.getDate()).slice(-2);
      downloadBlob(blob, t("xlsxFile", stamp));
      toast(t("xlsxSaved"));
    })["catch"](function () {
      toast(t("xlsxFailed"));
    });
  }

  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  /* ────────── 시작 ────────── */
  dbGet("kv", "state").then(function (saved) {
    var restored = migrate(saved);
    state = restored ? normalize(restored) : { markets: [newMarket()], currentMarket: 0, current: 0 };
    lang = (state.lang && I18N[state.lang]) ? state.lang : detectLang();
    state.lang = lang;
    talk = TALK_NAME[state.talk] ? state.talk : defaultTalk();
    state.talk = talk;
    applyLang();
    placeFab();
    if (saved) save();        /* 옛 형식을 읽었으면 새 형식으로 다시 저장해둔다 */
    return render();
  }).then(function () {
    var preload = function () { ensureJsQR(); };
    if (window.requestIdleCallback) requestIdleCallback(preload, { timeout: 8000 });
    else setTimeout(preload, 4000);
  })["catch"](function () {
    state = { markets: [newMarket()], currentMarket: 0, current: 0 };
    lang = detectLang();
    talk = defaultTalk();
    applyLang();
    placeFab();
    render();
    toast(t("storageWarn"));
  });
})();
</script>
</body>
</html>
