<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f3ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>아이템 소싱 노트</title>
<style>
  :root {
    --bg: #f5f3ef;
    --card: #ffffff;
    --text: #2b2b2b;
    --muted: #8a8580;
    --accent: #e2634f;
    --accent-soft: #f6d9d3;
    --border: #e8e4dd;
    --shadow: 0 4px 20px rgba(0,0,0,0.05);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    -webkit-text-size-adjust: 100%;
  }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; font-size: 16px; color: var(--text); }

  /* ── 상단 바 ── */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    height: 64px;
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px;
    background: rgba(245,243,239,0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .topbar .title {
    flex: 1; text-align: center;
    font-size: 16px; font-weight: 700; letter-spacing: -0.02em;
  }
  .icon-btn {
    border: 1px solid var(--border); background: var(--card);
    color: var(--text); border-radius: 12px;
    padding: 8px 12px; font-size: 14px; font-weight: 600;
    min-width: 44px; min-height: 40px;
  }
  .icon-btn:active { background: var(--accent-soft); }

  /* ── 시장(카테고리) 바 ── */
  .market-bar {
    position: sticky; top: 64px; z-index: 15;
    display: flex; align-items: center; gap: 8px;
    margin: -4px -14px 14px; padding: 10px 14px;
    background: rgba(245,243,239,0.95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .market-tag {
    flex: none; font-size: 11px; font-weight: 800; letter-spacing: 0.06em;
    color: var(--accent); background: var(--accent-soft);
    border-radius: 8px; padding: 5px 8px;
  }
  .market-input {
    flex: 1; min-width: 0; border: none; background: none;
    font-size: 17px; font-weight: 700; padding: 6px 2px; outline: none;
  }
  .market-input::placeholder { font-weight: 600; color: var(--muted); }
  .market-input:focus { border-bottom: 2px solid var(--accent); }
  .market-more {
    flex: none; border: 1px solid var(--border); background: var(--card);
    color: var(--muted); border-radius: 10px;
    padding: 8px 10px; font-size: 12px; font-weight: 700;
  }
  .market-more:active { background: var(--accent-soft); color: var(--accent); }

  /* ── 페이지 ── */
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px 14px calc(96px + var(--safe-b)); }
  .block {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 16px;
    margin-bottom: 16px;
  }
  .block-label {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; font-weight: 700; color: var(--muted);
    letter-spacing: 0.04em; margin-bottom: 10px;
  }
  .block-label .num {
    background: var(--accent-soft); color: var(--accent);
    border-radius: 8px; padding: 3px 8px; font-size: 12px;
  }
  .del-btn {
    border: none; background: none; color: var(--muted);
    font-size: 12px; padding: 4px 6px; border-radius: 8px;
  }
  .del-btn:active { background: var(--bg); }

  /* ── 사진 슬롯 ── */
  .slot {
    position: relative; width: 100%;
    border: 2px dashed var(--border); border-radius: 14px;
    background: #fbfaf8;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; color: var(--muted);
    aspect-ratio: 16 / 10;
    overflow: hidden;
  }
  .slot.item { aspect-ratio: 4 / 3; }
  .slot .cam { font-size: 30px; }
  .slot .hint { font-size: 13px; font-weight: 600; }
  .slot.filled { border-style: solid; border-color: var(--border); background: #000; }
  .slot img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .slot .tools {
    position: absolute; right: 8px; bottom: 8px; display: flex; gap: 6px;
  }
  .slot .tools button {
    border: none; border-radius: 10px;
    background: rgba(0,0,0,0.55); color: #fff;
    font-size: 12px; font-weight: 600; padding: 7px 10px;
    backdrop-filter: blur(4px);
  }

  /* ── 입력 ── */
  /* ── 명함 QR 줄 ── */
  .qr-row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-top: 10px; padding: 10px;
    background: #fbfaf8; border: 1px solid var(--border); border-radius: 12px;
  }
  .qr-info { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; }
  .qr-tag {
    flex: none; font-size: 11px; font-weight: 800; color: #1f9d55;
    background: #e4f5ea; border-radius: 7px; padding: 3px 7px;
  }
  .qr-text {
    flex: 1; min-width: 0; font-size: 12px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .qr-btns { flex: none; display: flex; gap: 6px; }
  .qr-btn {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 10px; padding: 8px 11px; font-size: 13px; font-weight: 600;
  }
  .qr-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .qr-btn.wide { width: 100%; color: var(--muted); font-weight: 600; }
  .qr-btn:active { filter: brightness(0.95); }

  .field { margin-top: 12px; }
  .field > label {
    display: block; font-size: 12px; font-weight: 700;
    color: var(--muted); margin-bottom: 6px;
  }
  .label-row {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px;
  }
  .label-say { display: inline-flex; align-items: center; gap: 7px; }
  .say {
    flex: none; border: 1px solid var(--border); background: var(--card);
    border-radius: 9px; padding: 2px 7px; font-size: 13px; line-height: 1.5;
  }
  .say:active { background: var(--accent-soft); }

  /* ── 중국어 문장 카드 ── */
  .phrase {
    background: var(--card); border-radius: 20px; padding: 24px 20px 16px;
    width: 100%; max-width: 340px; text-align: center;
  }
  .phrase .zh {
    font-size: 30px; font-weight: 800; line-height: 1.35;
    letter-spacing: 0.01em; margin-bottom: 10px; word-break: keep-all;
  }
  .phrase .pinyin { font-size: 14px; color: var(--muted); margin-bottom: 14px; }
  .phrase .ko {
    font-size: 14px; font-weight: 600; color: var(--accent);
    background: var(--accent-soft); border-radius: 10px;
    padding: 8px 10px; margin-bottom: 8px;
  }
  .phrase .note { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 14px; }
  .phrase .btns { display: flex; gap: 8px; }
  .phrase .btns button {
    flex: 1; border-radius: 12px; padding: 12px; font-size: 15px; font-weight: 600;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  .phrase .btns button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .input, textarea.input {
    width: 100%; border: 1px solid var(--border); border-radius: 12px;
    background: #fbfaf8; padding: 12px 13px; outline: none;
  }
  .input:focus { border-color: var(--accent); background: #fff; }
  textarea.input { resize: none; min-height: 44px; line-height: 1.5; overflow: hidden; }
  .with-suffix { position: relative; display: flex; align-items: center; }
  .with-suffix .input { padding-right: 58px; }
  .with-suffix .suffix {
    position: absolute; right: 13px; font-size: 13px;
    font-weight: 700; color: var(--muted); pointer-events: none;
  }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; min-width: 0; }
  select.input {
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%238a8580' stroke-width='2' stroke-linecap='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    padding-right: 36px;
  }

  .vendor-head .input { font-size: 17px; font-weight: 700; }

  .add-item {
    width: 100%; border: 1px dashed var(--accent);
    background: var(--accent-soft); color: var(--accent);
    border-radius: 16px; padding: 16px; font-size: 15px; font-weight: 700;
  }
  .add-item:active { filter: brightness(0.97); }
  .empty-note { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 16px; }

  /* ── 하단 페이지 이동 ── */
  .bottombar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px calc(10px + var(--safe-b));
    background: rgba(245,243,239,0.94);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--border);
  }
  .bottombar .nav {
    border: 1px solid var(--border); background: var(--card);
    border-radius: 14px; width: 56px; height: 44px; font-size: 16px; color: var(--text);
  }
  .bottombar .nav:disabled { opacity: 0.35; }
  .bottombar .indicator {
    flex: 1; text-align: center; font-size: 13px; font-weight: 700; color: var(--muted);
  }
  .bottombar .indicator b { color: var(--text); font-size: 15px; }

  /* ── 시트 / 모달 ── */
  .backdrop {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(0,0,0,0.45);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .backdrop.center { align-items: center; padding: 20px; }
  .sheet {
    width: 100%; max-width: 480px;
    background: var(--card); border-radius: 20px 20px 0 0;
    padding: 10px 14px calc(18px + var(--safe-b));
    max-height: 80vh; overflow-y: auto;
  }
  .sheet h3 { font-size: 14px; margin: 10px 4px 12px; color: var(--muted); }
  .sheet-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    border: none; background: none; text-align: left;
    padding: 14px 10px; border-radius: 12px; font-size: 15px; color: var(--text);
    border-bottom: 1px solid var(--border);
  }
  .sheet-item:last-child { border-bottom: none; }
  .sheet-item:active { background: var(--bg); }
  .sheet-item .sub { color: var(--muted); font-size: 12px; }
  .sheet-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .sheet-row {
    display: flex; align-items: stretch; gap: 4px;
    border-bottom: 1px solid var(--border);
  }
  .sheet-row:last-of-type { border-bottom: none; }
  .sheet-row .sheet-item { flex: 1; min-width: 0; border-bottom: none; }
  .phrase-row { align-items: center; }
  .phrase-row b { font-size: 16px; font-weight: 700; line-height: 1.5; }
  .phrase-row .sub { display: block; font-size: 12px; }
  .row-del {
    flex: none; width: 48px; border: none; background: none;
    font-size: 17px; border-radius: 12px; color: var(--muted);
  }
  .row-del:active { background: var(--accent-soft); }
  .sheet-item .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .dialog {
    background: var(--card); border-radius: 18px; padding: 22px 20px 16px;
    width: 100%; max-width: 320px; text-align: center;
  }
  .dialog p { margin: 0 0 18px; font-size: 15px; line-height: 1.5; white-space: pre-line; }
  .dialog .btns { display: flex; gap: 8px; }
  .dialog button {
    flex: 1; border-radius: 12px; padding: 12px; font-size: 15px; font-weight: 600;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  .dialog button.danger { background: var(--accent); border-color: var(--accent); color: #fff; }

  .viewer { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.92); display: flex; }
  .viewer img { margin: auto; max-width: 100%; max-height: 100%; }

  .toast {
    position: fixed; left: 50%; bottom: calc(84px + var(--safe-b)); transform: translateX(-50%);
    z-index: 60; background: rgba(43,43,43,0.94); color: #fff;
    padding: 11px 18px; border-radius: 14px; font-size: 14px; font-weight: 600;
    opacity: 0; transition: opacity 0.2s; pointer-events: none; max-width: 80vw; text-align: center;
  }
  .toast.show { opacity: 1; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header class="topbar">
  <button class="icon-btn" id="menuBtn" aria-label="메뉴">☰</button>
  <button class="icon-btn" id="phraseBtn" aria-label="중국어로 물어보기">💬</button>
  <div class="title">아이템 소싱 노트</div>
  <button class="icon-btn" id="addVendorBtn">+ 업체</button>
</header>

<main class="wrap" id="page"></main>

<nav class="bottombar">
  <button class="nav" data-nav="prev" aria-label="이전 업체">◀</button>
  <div class="indicator" id="indicator"></div>
  <button class="nav" data-nav="next" aria-label="다음 업체">▶</button>
</nav>

<input type="file" id="fileCamera" accept="image/*" capture="environment" class="hidden">
<input type="file" id="fileAlbum" accept="image/*" class="hidden">
<input type="file" id="fileRestore" accept="application/json,.json" class="hidden">

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  /* ────────── 저장소 (IndexedDB: 데이터 + 사진) ────────── */
  var DB_NAME = "sourcing-db", DB_VER = 1;
  var dbPromise = null;
  var memFallback = { kv: {}, images: {} };
  var useMemory = false;

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains("kv")) db.createObjectStore("kv");
        if (!db.objectStoreNames.contains("images")) db.createObjectStore("images");
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    })["catch"](function (err) {
      useMemory = true;
      throw err;
    });
    return dbPromise;
  }

  function tx(store, mode, fn) {
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var t = db.transaction(store, mode);
        var req = fn(t.objectStore(store));
        t.oncomplete = function () { resolve(req ? req.result : undefined); };
        t.onerror = function () { reject(t.error); };
        t.onabort = function () { reject(t.error); };
      });
    })["catch"](function () {
      useMemory = true;
      return null;
    });
  }

  function dbGet(store, key) {
    if (useMemory) return Promise.resolve(memFallback[store][key]);
    return tx(store, "readonly", function (s) { return s.get(key); }).then(function (v) {
      return useMemory ? memFallback[store][key] : v;
    });
  }
  function dbPut(store, key, val) {
    memFallback[store][key] = val;
    if (useMemory) return Promise.resolve();
    return tx(store, "readwrite", function (s) { return s.put(val, key); });
  }
  function dbDel(store, key) {
    delete memFallback[store][key];
    if (useMemory) return Promise.resolve();
    return tx(store, "readwrite", function (s) { return s["delete"](key); });
  }

  /* ────────── 상태 ────────── */
  var state = { markets: [], currentMarket: 0, current: 0 };
  var urlCache = {};   // photoId -> objectURL
  var saveTimer = null;

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function newItem() {
    return { id: uid(), photo: null, price: "", moq: "", memo: "" };
  }
  var INITIAL_ITEMS = 2;              // 새 업체 페이지에 기본으로 열어두는 물건 칸 수
  function newVendor(currency) {
    var items = [];
    for (var i = 0; i < INITIAL_ITEMS; i++) items.push(newItem());
    return {
      id: uid(), name: "", card: null,
      currency: currency || state.lastCurrency || "KRW",   /* 마지막에 쓰던 통화 이어받기 */
      items: items
    };
  }
  /* 사진·가격·수량·메모가 모두 비어 있으면 내보낼 때 제외 */
  function isBlankItem(it) {
    return !it.photo && !String(it.price).trim() && !String(it.moq).trim() && !String(it.memo).trim();
  }
  function filledItems(v) {
    return v.items.filter(function (it) { return !isBlankItem(it); });
  }
  function newMarket() {
    return { id: uid(), name: "", vendors: [newVendor(state.lastCurrency)] };
  }
  function market() { return state.markets[state.currentMarket]; }
  function vendors() { return market().vendors; }
  function vendor() { return vendors()[state.current]; }
  /* 이름을 안 치면 순서대로 "업체 1, 2, 3…" 으로 불린다 */
  function vendorLabel(v, i) {
    var name = v && v.name ? v.name.trim() : "";
    return name || ("업체 " + (i + 1));
  }
  function marketLabel(m, i) {
    var name = m && m.name ? m.name.trim() : "";
    return name || ("시장 " + (i + 1));
  }
  /* 옛 버전(시장 없이 업체만 있던 저장본)을 시장 1개로 감싸 올린다 */
  function migrate(saved) {
    if (!saved) return null;
    if (Array.isArray(saved.markets) && saved.markets.length) return saved;
    if (Array.isArray(saved.vendors) && saved.vendors.length) {
      return {
        markets: [{ id: uid(), name: "", vendors: saved.vendors }],
        currentMarket: 0,
        current: saved.current || 0
      };
    }
    return null;
  }
  function normalize(s) {
    s.markets.forEach(function (m) {
      if (!Array.isArray(m.vendors) || !m.vendors.length) m.vendors = [newVendor()];
      if (typeof m.name !== "string") m.name = "";
      m.vendors.forEach(function (v) {
        if (!Array.isArray(v.items)) v.items = [];
        if (!v.currency) v.currency = "KRW";
        if (typeof v.name !== "string") v.name = "";
        /* 예전에 만들어진 페이지(물건 1칸)도 기본 2칸이 되도록 빈 칸을 채운다 */
        while (v.items.length < INITIAL_ITEMS) v.items.push(newItem());
      });
    });
    s.currentMarket = Math.max(0, Math.min(s.markets.length - 1, s.currentMarket || 0));
    s.current = Math.max(0, Math.min(s.markets[s.currentMarket].vendors.length - 1, s.current || 0));
    if (!s.lastCurrency) {
      var cur = s.markets[s.currentMarket].vendors[s.current];
      s.lastCurrency = (cur && cur.currency) || "KRW";
    }
    return s;
  }

  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      dbPut("kv", "state", JSON.parse(JSON.stringify(state)));
    }, 250);
  }

  /* ────────── 사진 처리 ────────── */
  var MAX_DIM = 1400, QUALITY = 0.82;

  function loadBitmap(file) {
    if (typeof createImageBitmap === "function") {
      return createImageBitmap(file, { imageOrientation: "from-image" })["catch"](function () {
        return createImageBitmap(file);
      })["catch"](loadViaImg.bind(null, file));
    }
    return loadViaImg(file);
  }
  function loadViaImg(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("이미지를 읽을 수 없습니다")); };
      img.src = url;
    });
  }

  function compress(file) {
    return loadBitmap(file).then(function (src) {
      var w = src.width || src.naturalWidth;
      var h = src.height || src.naturalHeight;
      var scale = Math.min(1, MAX_DIM / Math.max(w, h));
      var cw = Math.max(1, Math.round(w * scale));
      var ch = Math.max(1, Math.round(h * scale));
      var canvas = document.createElement("canvas");
      canvas.width = cw; canvas.height = ch;
      canvas.getContext("2d").drawImage(src, 0, 0, cw, ch);
      if (src.close) src.close();
      return new Promise(function (resolve) {
        if (canvas.toBlob) {
          canvas.toBlob(function (blob) { resolve(blob || dataURLtoBlob(canvas.toDataURL("image/jpeg", QUALITY))); }, "image/jpeg", QUALITY);
        } else {
          resolve(dataURLtoBlob(canvas.toDataURL("image/jpeg", QUALITY)));
        }
      });
    });
  }

  function dataURLtoBlob(dataURL) {
    var parts = dataURL.split(",");
    var mime = /:(.*?);/.exec(parts[0])[1];
    var bin = atob(parts[1]);
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }
  function blobToDataURL(blob) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(r.result); };
      r.onerror = function () { reject(r.error); };
      r.readAsDataURL(blob);
    });
  }

    var missing = ids.filter(function (id) { return id && !urlCache[id]; });

  function formatNumber(raw) {
    var cleaned = String(raw).replace(/[^\d.]/g, "");
    var dot = cleaned.indexOf(".");
    if (dot !== -1) {
      cleaned = cleaned.slice(0, dot + 1) + cleaned.slice(dot + 1).replace(/\./g, "");
    }
    var parts = cleaned.split(".");
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return parts.join(".");
  }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

  /* ────────── 명함 QR 인식 ────────── */
  var qrLoader = null;
  function ensureJsQR() {
    if (window.jsQR) return Promise.resolve(true);
    if (qrLoader) return qrLoader;
    qrLoader = new Promise(function (resolve) {
      var sc = document.createElement("script");
      sc.src = "jsqr.min.js";
      sc.async = true;
      sc.onload = function () { resolve(!!window.jsQR); };
      sc.onerror = function () { qrLoader = null; resolve(false); };
      document.head.appendChild(sc);
    });
    return qrLoader;
  }

  /* 사진에서 QR을 찾아 문자열을 돌려준다 (없으면 null) */
  function scanQR(blob) {
    return ensureJsQR().then(function (ok) {
      if (!ok) return null;
      return loadBitmap(blob).then(function (src) {
        var w0 = src.width || src.naturalWidth;
        var h0 = src.height || src.naturalHeight;
        var canvas = document.createElement("canvas");
        var ctx = canvas.getContext("2d", { willReadFrequently: true });
        var found = null;
        /* 원본 크기로 먼저, 안 되면 절반으로 줄여 한 번 더 */
        [1, 0.5].forEach(function (scale) {
          if (found) return;
          var w = Math.max(1, Math.round(w0 * scale));
          var h = Math.max(1, Math.round(h0 * scale));
          canvas.width = w; canvas.height = h;
          ctx.drawImage(src, 0, 0, w, h);
          var img = ctx.getImageData(0, 0, w, h);
          var code = window.jsQR(img.data, w, h, { inversionAttempts: "attemptBoth" });
          if (code && code.data) found = code.data;
        });
        if (src.close) src.close();
        return found;
      });
    })["catch"](function () { return null; });
  }

  function isWechatLink(text) {
    return /(?:u\.wechat\.com|weixin\.qq\.com|wxid|weixin:)/i.test(String(text || ""));

  }
  function shortText(text, max) {
    text = String(text || "");
    return text.length > max ? text.slice(0, max - 1) + "…" : text;
  }

  /* 명함 사진에서 QR을 찾아 업체에 저장 */

  var zhVoice = null;
  function pickZhVoice() {
    if (!window.speechSynthesis || !speechSynthesis.getVoices) return null;
    var list = speechSynthesis.getVoices() || [];
    var fallback = null;
    for (var i = 0; i < list.length; i++) {
      var lang = String(list[i].lang || "").toLowerCase().replace(/_/g, "-");
      if (lang.indexOf("zh") === 0) {
        if (lang.indexOf("cn") > -1 || lang.indexOf("hans") > -1) return list[i];
        if (!fallback) fallback = list[i];
      }
    }
    return fallback;
  }
  if (window.speechSynthesis) {
    try {
      zhVoice = pickZhVoice();
      speechSynthesis.onvoiceschanged = function () { zhVoice = pickZhVoice(); };
    } catch (e) {}
  }

  function speakZh(text) {
    if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) return false;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-CN";
      if (!zhVoice) zhVoice = pickZhVoice();
      /* 목소리 지정이 실패해도(브라우저마다 다름) 읽기 자체는 계속되도록 */
      if (zhVoice) { try { u.voice = zhVoice; } catch (e) {} }
      u.rate = 0.85;
      speechSynthesis.speak(u);
      return true;
    } catch (e) {
      return false;
    }
  }

      m.vendors.forEach(dropVendorPhotos);

  function vendorToText(v, index) {

    items.forEach(function (it, i) {
      var parts = [];
      if (it.price) parts.push("가격 " + it.price + cur.suffix);
      if (it.moq) parts.push("최소수량 " + it.moq + "개");
      lines.push("- 물건 " + (i + 1) + (parts.length ? ": " + parts.join(" / ") : ""));
      if (it.memo) lines.push("  메모: " + it.memo.replace(/\n/g, " "));
    });
    return lines.join("\n");
  }

  /* ────────── 엑셀(XLSX) 내보내기 ────────── */
  var EMU_PER_PX = 9525;
  var PIC_BOX = { w: 142, h: 96 };      // 시트에 들어갈 사진 최대 크기(px)
  var PIC_ROW_HEIGHT = 78;              // 사진이 있을 때 행 높이(pt)

  var crcTable = (function () {
    var table = [], c, n, k;
    for (n = 0; n < 256; n++) {
      c = n;
      for (k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      table[n] = c >>> 0;
    }
    return table;
  })();
  function crc32(bytes) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) c = crcTable[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;

  function utf8(str) { return new TextEncoder().encode(str); }
  function xmlEsc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")

      .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "");
  }

  /* 무압축(store) ZIP 작성기 — xlsx는 zip 컨테이너 */
  function zipBlob(files) {
    var now = new Date();
    var dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
    var dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
    var parts = [], central = [], offset = 0, count = 0, centralSize = 0;

    files.forEach(function (f) {
      var name = utf8(f.name);
      var data = f.data;
      var crc = crc32(data);

      var local = new Uint8Array(30 + name.length);
      var lv = new DataView(local.buffer);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 0x0800, true);
      lv.setUint16(8, 0, true);
      lv.setUint16(10, dosTime, true);
      lv.setUint16(12, dosDate, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, data.length, true);
      lv.setUint32(22, data.length, true);
      lv.setUint16(26, name.length, true);
      local.set(name, 30);

      var cen = new Uint8Array(46 + name.length);
      var cv = new DataView(cen.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, dosTime, true);
      cv.setUint16(14, dosDate, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, data.length, true);
      cv.setUint32(24, data.length, true);
      cv.setUint16(28, name.length, true);
      cv.setUint32(42, offset, true);
      cen.set(name, 46);

      parts.push(local, data);
      central.push(cen);
      offset += local.length + data.length;
      centralSize += cen.length;
      count++;
    });

    var end = new Uint8Array(22);
    var ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, count, true);
    ev.setUint16(10, count, true);
    ev.setUint32(12, centralSize, true);
    ev.setUint32(16, offset, true);

    return new Blob(parts.concat(central, [end]), {
      type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    });
  }

  function blobBytes(blob) {
    if (blob.arrayBuffer) {
      return blob.arrayBuffer().then(function (ab) { return new Uint8Array(ab); });
    }
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(new Uint8Array(r.result)); };
      r.onerror = function () { reject(r.error); };
      r.readAsArrayBuffer(blob);
    });
  }

  /* 엑셀에 넣을 축소본 만들기 (원본을 그대로 넣으면 파일이 너무 커짐) */
  function makeThumb(blob) {
    return loadBitmap(blob).then(function (src) {
      var w = src.width || src.naturalWidth;
      var h = src.height || src.naturalHeight;
      var scale = Math.min(1, 420 / Math.max(w, h));
      var cw = Math.max(1, Math.round(w * scale));
      var ch = Math.max(1, Math.round(h * scale));
      var canvas = document.createElement("canvas");
      canvas.width = cw; canvas.height = ch;
      canvas.getContext("2d").drawImage(src, 0, 0, cw, ch);
      if (src.close) src.close();
      return new Promise(function (resolve) {
        if (canvas.toBlob) canvas.toBlob(function (b) { resolve(b || dataURLtoBlob(canvas.toDataURL("image/jpeg", 0.8))); }, "image/jpeg", 0.8);
        else resolve(dataURLtoBlob(canvas.toDataURL("image/jpeg", 0.8)));
      }).then(blobBytes).then(function (bytes) {
        return { bytes: bytes, w: cw, h: ch };
      });
    });
  }

  function colLetter(index) {
    var s = "", i = index;
    do { s = String.fromCharCode(65 + (i % 26)) + s; i = Math.floor(i / 26) - 1; } while (i >= 0);
    return s;
  }
  function cellStr(col, row, text, style) {
    var ref = colLetter(col) + row;
    if (text == null || text === "") return '<c r="' + ref + '" s="' + style + '"/>';
    return '<c r="' + ref + '" t="inlineStr" s="' + style + '"><is><t xml:space="preserve">' + xmlEsc(text) + '</t></is></c>';
  }
  function cellNum(col, row, value, style) {
    return '<c r="' + colLetter(col) + row + '" s="' + style + '"><v>' + value + '</v></c>';
  }
  /* "1,234" 처럼 입력된 값은 숫자 셀로, 그 외에는 글자 셀로 */
  function numericCell(col, row, raw, numStyle, textStyle) {
    var text = String(raw == null ? "" : raw).trim();
    if (!text) return cellStr(col, row, "", numStyle);
    var stripped = text.replace(/,/g, "");
    if (/^\d+(\.\d+)?$/.test(stripped)) return cellNum(col, row, stripped, numStyle);
    return cellStr(col, row, text, textStyle);
  }

  var XLSX_HEADERS = ["시장", "업체 번호", "업체명 / 담당자", "통화", "명함", "명함 QR / 위챗 링크", "물건 번호", "물건 사진", "가격", "최소수량", "메모"];
  var XLSX_WIDTHS = [18, 9, 24, 12, 22, 38, 9, 22, 14, 12, 46];
  var COL_CARD = 4, COL_PHOTO = 7;      // 명함 / 물건 사진이 들어갈 열 (0-based)

  function stylesXML() {
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0.##"/></numFmts>' +
      '<fonts count="2">' +
        '<font><sz val="11"/><color rgb="FF2B2B2B"/><name val="맑은 고딕"/></font>' +
        '<font><b/><sz val="11"/><color rgb="FFB2412F"/><name val="맑은 고딕"/></font>' +
      '</fonts>' +
      '<fills count="3">' +
        '<fill><patternFill patternType="none"/></fill>' +
        '<fill><patternFill patternType="gray125"/></fill>' +
        '<fill><patternFill patternType="solid"><fgColor rgb="FFF6D9D3"/><bgColor indexed="64"/></patternFill></fill>' +
      '</fills>' +
      '<borders count="2">' +
        '<border><left/><right/><top/><bottom/><diagonal/></border>' +
        '<border><left style="hair"><color rgb="FFD8D2CA"/></left><right style="hair"><color rgb="FFD8D2CA"/></right>' +
        '<top style="hair"><color rgb="FFD8D2CA"/></top><bottom style="hair"><color rgb="FFD8D2CA"/></bottom><diagonal/></border>' +
      '</borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="5">' +
        '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
        '<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>' +
        '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>' +
        '<xf numFmtId="164" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf>' +
        '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="left" vertical="top" wrapText="1"/></xf>' +
      '</cellXfs>' +
      '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
      '</styleSheet>';
  }

  function sheetXML(rows, rowHeight, hasDrawing) {
    var x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"' +
      ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<sheetViews><sheetView tabSelected="1" workbookViewId="0">' +
      '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>' +
      '</sheetView></sheetViews>' +
      '<sheetFormatPr defaultRowHeight="16.5"/><cols>';
    XLSX_WIDTHS.forEach(function (w, i) {
      x += '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>';
    });
    x += '</cols><sheetData><row r="1" ht="28" customHeight="1">';
    XLSX_HEADERS.forEach(function (h, i) { x += cellStr(i, 1, h, 1); });
    x += '</row>';

    rows.forEach(function (row, i) {
      var r = i + 2;
      x += '<row r="' + r + '" ht="' + rowHeight + '" customHeight="1">' +
        cellStr(0, r, row.market, 4) +
        cellNum(1, r, row.vendorNo, 2) +
        cellStr(2, r, row.vendorName, 4) +
        cellStr(3, r, row.currency, 2) +
        cellStr(4, r, "", 2) +
        cellStr(5, r, row.qr, 4) +
        (row.itemNo ? cellNum(6, r, row.itemNo, 2) : cellStr(6, r, "", 2)) +
        cellStr(7, r, "", 2) +
        numericCell(8, r, row.price, 3, 2) +
        numericCell(9, r, row.moq, 3, 2) +
        cellStr(10, r, row.memo, 4) +
        '</row>';
    });

    x += '</sheetData><autoFilter ref="A1:' + colLetter(XLSX_HEADERS.length - 1) + (rows.length + 1) + '"/>';
    if (hasDrawing) x += '<drawing r:id="rId1"/>';
    return x + '</worksheet>';
  }

  function drawingXML(pics) {
    var x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing"' +
      ' xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"' +
      ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">';
    pics.forEach(function (p, i) {
      var scale = Math.min(PIC_BOX.w / p.thumb.w, PIC_BOX.h / p.thumb.h, 1);
      var cx = Math.round(p.thumb.w * scale * EMU_PER_PX);
      var cy = Math.round(p.thumb.h * scale * EMU_PER_PX);
      x += '<xdr:oneCellAnchor>' +
        '<xdr:from><xdr:col>' + p.col + '</xdr:col><xdr:colOff>38100</xdr:colOff>' +
        '<xdr:row>' + p.row + '</xdr:row><xdr:rowOff>38100</xdr:rowOff></xdr:from>' +
        '<xdr:ext cx="' + cx + '" cy="' + cy + '"/>' +
        '<xdr:pic><xdr:nvPicPr><xdr:cNvPr id="' + (i + 2) + '" name="사진 ' + (i + 1) + '"/>' +
        '<xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr>' +
        '<xdr:blipFill><a:blip r:embed="rId' + (i + 1) + '"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill>' +
        '<xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="' + cx + '" cy="' + cy + '"/></a:xfrm>' +
        '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr>' +
        '</xdr:pic><xdr:clientData/></xdr:oneCellAnchor>';
    });
    return x + '</xdr:wsDr>';
  }

  function exportExcel() {
    var rows = [], picJobs = [];
    state.markets.forEach(function (m, mi) {
      m.vendors.forEach(function (v, vi) {
        var cur = CURRENCIES[v.currency] || CURRENCIES.KRW;
        var items = filledItems(v);
        if (!items.length) items = [null];      // 물건이 하나도 없으면 업체 줄만 남김
        items.forEach(function (it, ii) {
          rows.push({
            market: marketLabel(m, mi),
            vendorNo: vi + 1,
            vendorName: vendorLabel(v, vi),
            currency: cur.label,
            qr: ii === 0 ? (v.cardQr || "") : "",
            itemNo: it ? ii + 1 : 0,
            price: it ? it.price : "",
            moq: it ? it.moq : "",
            memo: it ? it.memo : ""
          });
          var rowIndex = rows.length;                // 헤더가 1행이므로 0-based 행 = rows.length
          if (ii === 0 && v.card) picJobs.push({ row: rowIndex, col: COL_CARD, id: v.card });
          if (it && it.photo) picJobs.push({ row: rowIndex, col: COL_PHOTO, id: it.photo });
        });
      });
    });

    if (!rows.length) { toast("내보낼 내용이 없습니다"); return; }
    toast("엑셀 파일 만드는 중…");

    return Promise.all(picJobs.map(function (job) {
      return dbGet("images", job.id).then(function (blob) {
        if (!blob) return null;
        return makeThumb(blob).then(function (thumb) { job.thumb = thumb; return job; });
      })["catch"](function () { return null; });
    })).then(function (result) {
      var pics = result.filter(Boolean);
      var files = [];

      var contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
        '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
        '<Default Extension="xml" ContentType="application/xml"/>' +
        '<Default Extension="jpeg" ContentType="image/jpeg"/>' +
        '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
        '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
        '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
        (pics.length ? '<Override PartName="/xl/drawings/drawing1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>' : "") +
        '</Types>';

      var rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
        '</Relationships>';

      var workbook = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"' +
        ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
        '<sheets><sheet name="소싱목록" sheetId="1" r:id="rId1"/></sheets></workbook>';

      var workbookRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
        '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
        '</Relationships>';

      files.push({ name: "[Content_Types].xml", data: utf8(contentTypes) });
      files.push({ name: "_rels/.rels", data: utf8(rootRels) });
      files.push({ name: "xl/workbook.xml", data: utf8(workbook) });
      files.push({ name: "xl/_rels/workbook.xml.rels", data: utf8(workbookRels) });
      files.push({ name: "xl/styles.xml", data: utf8(stylesXML()) });
      files.push({ name: "xl/worksheets/sheet1.xml", data: utf8(sheetXML(rows, pics.length ? PIC_ROW_HEIGHT : 22, pics.length > 0)) });

      if (pics.length) {
        var sheetRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
          '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
          '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing1.xml"/>' +
          '</Relationships>';
        var drawingRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
          '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
          pics.map(function (p, i) {
            return '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/image' + (i + 1) + '.jpeg"/>';
          }).join("") + '</Relationships>';

        files.push({ name: "xl/worksheets/_rels/sheet1.xml.rels", data: utf8(sheetRels) });
        files.push({ name: "xl/drawings/drawing1.xml", data: utf8(drawingXML(pics)) });
        files.push({ name: "xl/drawings/_rels/drawing1.xml.rels", data: utf8(drawingRels) });
        pics.forEach(function (p, i) {
          files.push({ name: "xl/media/image" + (i + 1) + ".jpeg", data: p.thumb.bytes });
        });
      }

      var blob = zipBlob(files);
      var d = new Date();
      var stamp = d.getFullYear() + ("0" + (d.getMonth() + 1)).slice(-2) + ("0" + d.getDate()).slice(-2);
      downloadBlob(blob, "소싱목록-" + stamp + ".xlsx");
      toast("엑셀 파일을 저장했습니다");
    })["catch"](function () {
      toast("엑셀 저장에 실패했습니다");
    });
  }

  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  /* ────────── 시작 ────────── */
  dbGet("kv", "state").then(function (saved) {
    var restored = migrate(saved);
    state = restored ? normalize(restored) : { markets: [newMarket()], currentMarket: 0, current: 0 };
    return render();
  }).then(function () {
    var preload = function () { ensureJsQR(); };
    if (window.requestIdleCallback) requestIdleCallback(preload, { timeout: 8000 });
    else setTimeout(preload, 4000);
  })["catch"](function () {
    state = { markets: [newMarket()], currentMarket: 0, current: 0 };
    render();
    toast("저장 공간을 쓸 수 없어 임시로 동작합니다");
  });
})();
</script>
</body>
</html>
