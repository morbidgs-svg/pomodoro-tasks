<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f3ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="소싱노트">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<title>아이템 소싱 노트</title>
<style>
  :root {
    --bg: #f5f3ef;
    --card: #ffffff;
    --text: #2b2b2b;
    --muted: #8a8580;
    --accent: #e2634f;
    --accent-soft: #f6d9d3;
    --border: #e8e4dd;
    --shadow: 0 4px 20px rgba(0,0,0,0.05);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button, .nav, .shot { touch-action: manipulation; }

  /* 손가락이 닿는 범위를 넓힌다 — 보이는 크기는 그대로 두고 둘레만 키운다 */
  .icon-btn, .say, .del-btn, .market-more, .search-cancel,
  .trans-bar .mini, .trans-type .side, .trans-type .send,
  .bub .acts button, .row-del { position: relative; }
  .icon-btn::after, .say::after, .del-btn::after, .market-more::after, .search-cancel::after,
  .trans-bar .mini::after, .trans-type .side::after, .trans-type .send::after,
  .bub .acts button::after, .row-del::after { content: ""; position: absolute; }
  .icon-btn::after { inset: -4px -1px; }
  .say::after { inset: -10px -8px; }
  .market-more::after { inset: -6px -4px; }
  .search-cancel::after { inset: -5px -8px; }
  .trans-bar .mini::after { inset: -8px -6px; }
  .trans-type .side::after, .trans-type .send::after { inset: -7px -3px; }
  .bub .acts button::after { inset: -9px -3px; }
  .row-del::after { inset: -6px -4px; }
  /* 지우는 버튼은 실수로 눌리면 곤란하니 조금만 넓힌다 */
  .del-btn::after { inset: -7px -6px; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    -webkit-text-size-adjust: 100%;
  }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; font-size: 16px; color: var(--text); }

  /* ── 상단 바 ── */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    height: 64px;
    display: flex; align-items: center; gap: 6px;
    padding: 12px 14px;
    background: rgba(245,243,239,0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  /* 양옆 버튼 묶음이 같은 너비로 벌어지면서 제목이 화면 한가운데 온다 */
  .topbar .bar-side { flex: 1 1 0; min-width: fit-content; display: flex; align-items: center; gap: 6px; }
  .topbar .bar-side.end { justify-content: flex-end; }
  .topbar .title {
    flex: 0 1 auto; min-width: 0; text-align: center; padding: 0 2px;
    font-size: 15px; font-weight: 700; letter-spacing: -0.02em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .icon-btn {
    border: 1px solid var(--border); background: var(--card);
    color: var(--text); border-radius: 12px;
    padding: 8px 10px; font-size: 14px; font-weight: 600;
    min-width: 42px; min-height: 40px;
  }
  .icon-btn:active { background: var(--accent-soft); }
  /* 작은 화면에서는 제목이 잘리지 않게 조금 줄인다 */
  @media (max-width: 370px) {
    .topbar .title { font-size: 15px; }
    .icon-btn { min-width: 40px; padding: 8px 8px; }
  }
  @media (max-width: 340px) {
    .topbar { gap: 4px; padding: 12px 10px; }
    .topbar .bar-side { gap: 4px; }
    .topbar .title { font-size: 14px; }
    .icon-btn { min-width: 38px; padding: 8px 6px; }
  }

  /* ── 시장(카테고리) 바 ── */
  .market-bar {
    position: sticky; top: 64px; z-index: 15;
    display: flex; align-items: center; gap: 8px;
    margin: -4px -14px 14px; padding: 10px 14px;
    background: rgba(245,243,239,0.95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .market-tag {
    flex: none; font-size: 11px; font-weight: 800; letter-spacing: 0.06em;
    color: var(--accent); background: var(--accent-soft);
    border-radius: 8px; padding: 5px 8px;
  }
  .market-input {
    flex: 1; min-width: 0; border: none; background: none;
    font-size: 17px; font-weight: 700; padding: 12px 2px; outline: none;
  }
  .market-input::placeholder { font-weight: 600; color: var(--muted); }
  .market-input:focus { border-bottom: 2px solid var(--accent); }
  .market-more {
    flex: none; border: 1px solid var(--border); background: var(--card);
    color: var(--muted); border-radius: 10px;
    padding: 10px 11px; font-size: 12px; font-weight: 700;
  }
  .market-more:active { background: var(--accent-soft); color: var(--accent); }

  /* ── 페이지 ── */
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px 14px calc(150px + var(--safe-b)); }
  .block {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 16px;
    margin-bottom: 16px;
  }
  .block-label {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; font-weight: 700; color: var(--muted);
    letter-spacing: 0.04em; margin-bottom: 10px;
  }
  .block-label .num {
    background: var(--accent-soft); color: var(--accent);
    border-radius: 8px; padding: 3px 8px; font-size: 12px;
  }
  .del-btn {
    border: none; background: none; color: var(--muted);
    font-size: 12px; padding: 4px 6px; border-radius: 8px;
  }
  .del-btn:active { background: var(--bg); }

  /* ── 사진 띠 (옆으로 밀어서 여러 장) ── */
  .strip {
    display: flex; gap: 8px;
    overflow-x: auto; overscroll-behavior-x: contain;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .strip::-webkit-scrollbar { display: none; }
  .shot {
    position: relative; flex: 0 0 86%; scroll-snap-align: center;
    border: 2px dashed var(--border); border-radius: 14px;
    background: #fbfaf8;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; color: var(--muted);
    aspect-ratio: 16 / 10;
    overflow: hidden;
  }
  .strip.empty .shot { flex: 0 0 100%; }
  .strip.item .shot { aspect-ratio: 4 / 3; }
  .shot .cam { font-size: 30px; }
  .shot .hint { font-size: 13px; font-weight: 600; }
  .shot.filled { border-style: solid; border-color: var(--border); background: #000; }
  .shot img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .shot-no {
    position: absolute; left: 8px; bottom: 8px;
    background: rgba(0,0,0,0.55); color: #fff;
    font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 9px;
    backdrop-filter: blur(4px);
  }
  .shot-del {
    position: absolute; right: 8px; top: 8px;
    border: none; border-radius: 50%;
    background: rgba(0,0,0,0.55); color: #fff;
    width: 30px; height: 30px; font-size: 13px; line-height: 1;
    backdrop-filter: blur(4px);
  }

  /* ── 입력 ── */
  /* ── 명함 QR 줄 ── */
  .qr-row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-top: 10px; padding: 10px;
    background: #fbfaf8; border: 1px solid var(--border); border-radius: 12px;
  }
  .qr-info { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; }
  .qr-tag {
    flex: none; font-size: 11px; font-weight: 800; color: #1f9d55;
    background: #e4f5ea; border-radius: 7px; padding: 3px 7px;
  }
  .qr-text {
    flex: 1; min-width: 0; font-size: 12px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .qr-btns { flex: none; display: flex; gap: 6px; }
  .qr-btn {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 10px; padding: 8px 11px; font-size: 13px; font-weight: 600;
  }
  .qr-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .qr-btn.wide { width: 100%; color: var(--muted); font-weight: 600; }
  .qr-btn:active { filter: brightness(0.95); }

  .field { margin-top: 12px; }
  .field > label {
    display: block; font-size: 12px; font-weight: 700;
    color: var(--muted); margin-bottom: 6px;
  }
  .label-row {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px;
  }
  .label-say { display: inline-flex; align-items: center; gap: 7px; }
  .label-row .zh {
    font-size: 13px; font-weight: 700; color: var(--text);
    letter-spacing: 0.02em;
  }
  .say {
    flex: none; border: 1px solid var(--border); background: var(--card);
    border-radius: 9px; padding: 4px 9px; font-size: 14px; line-height: 1.5;
  }
  .say:active { background: var(--accent-soft); }

  /* ── 중국어 문장 카드 ── */
  .phrase {
    background: var(--card); border-radius: 20px; padding: 24px 20px 16px;
    width: 100%; max-width: 340px; text-align: center;
  }
  .phrase .zh {
    font-size: 30px; font-weight: 800; line-height: 1.35;
    letter-spacing: 0.01em; margin-bottom: 10px; word-break: keep-all;
  }
  .phrase .zh.en { font-size: 25px; word-break: normal; }
  .phrase .pinyin { font-size: 14px; color: var(--muted); margin-bottom: 14px; }
  .phrase .ko {
    font-size: 14px; font-weight: 600; color: var(--accent);
    background: var(--accent-soft); border-radius: 10px;
    padding: 8px 10px; margin-bottom: 8px;
  }
  .phrase .note { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 14px; }
  .phrase .btns { display: flex; gap: 8px; }
  .phrase .btns button {
    flex: 1; border-radius: 12px; padding: 12px; font-size: 15px; font-weight: 600;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  .phrase .btns button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .input, textarea.input {
    width: 100%; border: 1px solid var(--border); border-radius: 12px;
    background: #fbfaf8; padding: 12px 13px; outline: none;
  }
  .input:focus { border-color: var(--accent); background: #fff; }
  textarea.input { resize: none; min-height: 44px; line-height: 1.5; overflow: hidden; }
  .with-suffix { position: relative; display: flex; align-items: center; }
  .with-suffix .input { padding-right: 58px; }
  .with-suffix .suffix {
    position: absolute; right: 13px; font-size: 13px;
    font-weight: 700; color: var(--muted); pointer-events: none;
  }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; min-width: 0; }
  select.input {
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%238a8580' stroke-width='2' stroke-linecap='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    padding-right: 36px;
  }

  .vendor-head .input { font-size: 17px; font-weight: 700; }

  .add-item {
    width: 100%; border: 1px dashed var(--accent);
    background: var(--accent-soft); color: var(--accent);
    border-radius: 16px; padding: 16px; font-size: 15px; font-weight: 700;
  }
  .add-item:active { filter: brightness(0.97); }
  .empty-note { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 16px; }

  /* ── 하단 페이지 이동 ── */
  .bottombar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px calc(10px + var(--safe-b));
    background: rgba(245,243,239,0.94);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--border);
  }
  .bottombar .nav {
    border: 1px solid var(--border); background: var(--card);
    border-radius: 14px; width: 56px; height: 44px; font-size: 16px; color: var(--text);
  }
  .bottombar .nav:disabled { opacity: 0.35; }
  .bottombar .indicator {
    flex: 1; text-align: center; font-size: 13px; font-weight: 700; color: var(--muted);
  }
  .bottombar .indicator b { color: var(--text); font-size: 15px; }

  /* ── 시트 / 모달 ── */
  .backdrop.over { z-index: 70; }     /* 대화 번역 화면 위에 뜨는 시트 */
  .backdrop {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(0,0,0,0.45);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .backdrop.center { align-items: center; padding: 20px; }
  .sheet {
    width: 100%; max-width: 480px;
    background: var(--card); border-radius: 20px 20px 0 0;
    padding: 10px 14px calc(18px + var(--safe-b));
    max-height: 80vh; overflow-y: auto;
  }
  .sheet h3 { font-size: 14px; margin: 10px 4px 12px; color: var(--muted); }
  .sheet .hint { font-size: 12px; color: var(--muted); line-height: 1.6; margin: 12px 4px 2px; }
  .seg { display: flex; gap: 8px; margin: 4px 4px 14px; }
  .seg button {
    flex: 1; padding: 13px 6px; border-radius: 12px; font-size: 15px; font-weight: 700;
    border: 1px solid var(--border); background: var(--card); color: var(--muted);
  }
  .seg button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .sheet-close { justify-content: center; color: var(--muted); font-weight: 700; }
  .sheet-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    border: none; background: none; text-align: left;
    padding: 14px 10px; border-radius: 12px; font-size: 15px; color: var(--text);
    border-bottom: 1px solid var(--border);
  }
  .sheet-item:last-child { border-bottom: none; }
  .sheet-item:active { background: var(--bg); }
  .sheet-item .sub { color: var(--muted); font-size: 12px; }
  .sheet-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .sheet-row {
    display: flex; align-items: stretch; gap: 4px;
    border-bottom: 1px solid var(--border);
  }
  .sheet-row:last-of-type { border-bottom: none; }
  .sheet-row .sheet-item { flex: 1; min-width: 0; border-bottom: none; }
  .phrase-row { align-items: center; }
  .phrase-row b { font-size: 16px; font-weight: 700; line-height: 1.5; }
  .phrase-row .sub { display: block; font-size: 12px; }
  .row-del {
    flex: none; width: 48px; border: none; background: none;
    font-size: 17px; border-radius: 12px; color: var(--muted);
  }
  .row-del:active { background: var(--accent-soft); }
  .sheet-item .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 영어 문장은 길어서 한 줄에 안 들어간다 */
  .sheet-item.phrase-row .grow { overflow: visible; white-space: normal; }

  /* ── 업체 검색 ── */
  .search-back {
    position: fixed; inset: 0; z-index: 60;
    background: var(--bg); display: flex; flex-direction: column;
  }
  /* ── 동그란 번역 버튼 ── */
  .track-pill {
    position: fixed; left: 14px; bottom: calc(80px + var(--safe-b)); z-index: 30;
    display: flex; align-items: center; gap: 7px;
    border: 1px solid var(--accent); background: var(--card); color: var(--accent);
    border-radius: 999px; padding: 10px 14px; font-size: 13px; font-weight: 700;
    box-shadow: var(--shadow);
  }
  .track-pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: micPulse 1.6s infinite; }
  body.has-overlay .track-pill { display: none; }

  .fab {
    position: fixed; right: 16px; bottom: calc(78px + var(--safe-b)); z-index: 30;
    width: 62px; height: 62px; border-radius: 50%;
    border: none; background: var(--accent); color: #fff;
    font-size: 27px; line-height: 1;
    box-shadow: 0 6px 18px rgba(0,0,0,0.22);
    display: flex; align-items: center; justify-content: center;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .fab:active { transform: scale(0.94); }
  .fab::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; }
  /* 꾹 누르면 집어서 옮기는 중 */
  .fab.drag { transform: scale(1.15); opacity: 0.93; box-shadow: 0 10px 26px rgba(0,0,0,0.3); }
  /* 번역 화면 위에서는 나가기 버튼이 된다 */
  body.trans-open .fab { z-index: 65; background: var(--text); font-size: 24px; }
  /* 검색처럼 다른 전체 화면에서는 숨긴다 */
  body.has-overlay:not(.trans-open) .fab { display: none; }

  /* ── 지도 · 길 기록 ── */
  .map-back { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; }
  .map-bar {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
    background: var(--card); border-bottom: 1px solid var(--border);
  }
  .map-bar .mini {
    flex: none; border: 1px solid var(--border); background: var(--bg); color: var(--muted);
    border-radius: 11px; padding: 10px 12px; font-size: 13px; font-weight: 600;
    position: relative;
  }
  .map-bar .mini::after { content: ""; position: absolute; inset: -8px -6px; }
  .map-title { flex: 1; min-width: 0; text-align: center; font-size: 15px; font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .map-wrap { flex: 1; position: relative; overflow: hidden; }
  .map-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .map-msg {
    position: absolute; left: 14px; right: 14px; top: 50%; transform: translateY(-50%);
    text-align: center; color: var(--muted); font-size: 14px; line-height: 1.8; white-space: pre-line;
  }
  .map-note {
    position: absolute; left: 10px; right: 10px; bottom: 8px;
    text-align: center; font-size: 11px; color: var(--muted);
  }
  .map-foot {
    flex: none; display: flex; gap: 8px; padding: 10px 14px calc(12px + var(--safe-b));
    background: var(--card); border-top: 1px solid var(--border);
  }
  .map-foot button {
    flex: 1; min-width: 0; border: 1px solid var(--border); background: var(--bg); color: var(--text);
    border-radius: 13px; padding: 13px 6px; font-size: 14px; font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .map-foot button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ── 대화 번역 ── */
  .trans-back { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; }
  .trans-bar {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
    background: var(--card); border-bottom: 1px solid var(--border);
  }
  .trans-pair { flex: 1; min-width: 0; font-size: 15px; font-weight: 700; text-align: center; }
  .trans-bar .mini {
    flex: none; border: 1px solid var(--border); background: var(--bg); color: var(--muted);
    border-radius: 11px; padding: 10px 12px; font-size: 13px; font-weight: 600;
  }
  .trans-body { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .trans-empty { margin: auto; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.8; white-space: pre-line; }
  .bub { max-width: 90%; border-radius: 16px; padding: 10px 12px; background: var(--card); box-shadow: var(--shadow); }
  .bub.me { align-self: flex-end; background: var(--accent-soft); }
  .bub.you { align-self: flex-start; }
  .bub .src { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 4px; }
  .bub .dst { font-size: 19px; font-weight: 700; line-height: 1.45; word-break: keep-all; }
  .bub.wait .dst, .bub.fail .dst { font-size: 14px; font-weight: 600; color: var(--muted); }
  .bub .acts { display: flex; gap: 10px; margin-top: 10px; }
  .bub .acts button {

  }

  }

  }

    flex: none; display: flex; justify-content: space-around; align-items: flex-start;

  }
  .mic {
    flex: none; border: none; background: none; padding: 0; color: var(--text);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
  }
  .mic .dot {
    width: 86px; height: 86px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--bg);

  .mic.on .dot {

  }
  .mic.on .lab { color: var(--accent); }
  @keyframes micPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(226,99,79,0.45); }

  }
  .search-bar {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
    background: var(--card); border-bottom: 1px solid var(--border);
  }
  .search-input {
    flex: 1; min-width: 0; border: 1px solid var(--border); border-radius: 12px;
    padding: 11px 12px; background: var(--bg); outline: none;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-cancel {

    font-size: 14px; font-weight: 600; padding: 10px 4px;
  }
  .search-body { flex: 1; overflow-y: auto; padding: 10px 14px calc(24px + var(--safe-b)); }
  .search-msg { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 16px 4px; }
  .hit {
    display: flex; gap: 12px; width: 100%; text-align: left;
    border: none; background: var(--card); border-radius: 14px;
    padding: 12px; margin-bottom: 8px; box-shadow: var(--shadow);
  }
  .hit:active { background: var(--accent-soft); }
  .hit-thumb {
    flex: none; width: 64px; height: 64px; border-radius: 10px; overflow: hidden;
    background: var(--bg); display: flex; align-items: center; justify-content: center;

  }
  .hit-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .hit-body { flex: 1; min-width: 0; }
  .hit-title { display: block; font-size: 15px; font-weight: 700; line-height: 1.4; }
  .hit-sub { display: block; font-size: 12px; color: var(--muted); margin: 2px 0 6px; }
  .hit-line {
    font-size: 13px; line-height: 1.5; margin-top: 2px;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .hit-label { font-size: 11px; font-weight: 700; color: var(--muted); margin-right: 4px; }
  mark { background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 0 2px; font-weight: 700; }
  .block.flash { animation: flash 1.4s ease; }
  @keyframes flash {

    25%, 65% { box-shadow: 0 0 0 3px var(--accent); }

  .dialog {
    background: var(--card); border-radius: 18px; padding: 22px 20px 16px;

  .dialog p { margin: 0 0 18px; font-size: 15px; line-height: 1.5; white-space: pre-line; }

  .dialog .btns { display: flex; gap: 8px; }
  .dialog button {
    flex: 1; border-radius: 12px; padding: 12px; font-size: 15px; font-weight: 600;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);

  .dialog button.danger, .dialog button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  .viewer { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.92); display: flex; }
  .viewer img { margin: auto; max-width: 100%; max-height: 100%; }

  .toast {
    position: fixed; left: 50%; bottom: calc(96px + var(--safe-b)); transform: translateX(-50%);
    z-index: 90; background: rgba(43,43,43,0.94); color: #fff;
    padding: 11px 18px; border-radius: 14px; font-size: 14px; font-weight: 600;
    opacity: 0; transition: opacity 0.2s; pointer-events: none; max-width: 80vw; text-align: center;
  }
  .toast.show { opacity: 1; }
  /* 대화 번역·검색 화면에서는 아래쪽 버튼에 가리지 않게 더 위로 */
  body.has-overlay .toast { bottom: calc(170px + var(--safe-b)); }
  .hidden { display: none !important; }

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  /* ────────── 저장소 (IndexedDB: 데이터 + 사진) ────────── */
  var DB_NAME = "sourcing-db", DB_VER = 1;
  var dbPromise = null;
  var memFallback = { kv: {}, images: {} };
  var useMemory = false;

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains("kv")) db.createObjectStore("kv");
        if (!db.objectStoreNames.contains("images")) db.createObjectStore("images");
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    })["catch"](function (err) {
      useMemory = true;
      throw err;
    });
    return dbPromise;
  }

  function tx(store, mode, fn) {
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var t = db.transaction(store, mode);
        var req = fn(t.objectStore(store));
        t.oncomplete = function () { resolve(req ? req.result : undefined); };
        t.onerror = function () { reject(t.error); };
        t.onabort = function () { reject(t.error); };
      });
    })["catch"](function () {
      useMemory = true;
      return null;
    });
  }

  function dbGet(store, key) {
    if (useMemory) return Promise.resolve(memFallback[store][key]);
    return tx(store, "readonly", function (s) { return s.get(key); }).then(function (v) {
      return useMemory ? memFallback[store][key] : v;
    });
  }
  function dbPut(store, key, val) {
    memFallback[store][key] = val;
    if (useMemory) return Promise.resolve();
    return tx(store, "readwrite", function (s) { return s.put(val, key); });
  }
  function dbDel(store, key) {
    delete memFallback[store][key];
    if (useMemory) return Promise.resolve();
    return tx(store, "readwrite", function (s) { return s["delete"](key); });
  }

  /* ────────── 상태 ────────── */
  var state = { markets: [], currentMarket: 0, current: 0 };
  var urlCache = {};   // photoId -> objectURL
  var saveTimer = null;

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function newItem() {
    return { id: uid(), photos: [], price: "", moq: "", memo: "" };
  }
  var INITIAL_ITEMS = 2;              // 새 업체 페이지에 기본으로 열어두는 물건 칸 수
  function newVendor(currency) {
    var items = [];
    for (var i = 0; i < INITIAL_ITEMS; i++) items.push(newItem());
    return {
      id: uid(), name: "", cards: [],
      currency: currency || state.lastCurrency || "KRW",   /* 마지막에 쓰던 통화 이어받기 */
      items: items
    };
  }
  /* 사진·가격·수량·메모가 모두 비어 있으면 내보낼 때 제외 */
  function isBlankItem(it) {
    return !(it.photos && it.photos.length) && !String(it.price).trim() && !String(it.moq).trim() && !String(it.memo).trim();
  }
  function filledItems(v) {
    return v.items.filter(function (it) { return !isBlankItem(it); });
  }
  function newMarket() {
    return { id: uid(), name: "", vendors: [newVendor(state.lastCurrency)] };
  }
  function market() { return state.markets[state.currentMarket]; }
  function vendors() { return market().vendors; }
  function vendor() { return vendors()[state.current]; }
  /* 이름을 안 치면 순서대로 "업체 1, 2, 3…" 으로 불린다 */
  function vendorLabel(v, i) {
    var name = v && v.name ? v.name.trim() : "";
    return name || t("vendorAuto", i + 1);
  }
  function marketLabel(m, i) {
    var name = m && m.name ? m.name.trim() : "";
    return name || t("marketAuto", i + 1);
  }
  /* 옛 버전(시장 없이 업체만 있던 저장본)을 시장 1개로 감싸 올린다 */
  function migrate(saved) {
    if (!saved) return null;
    if (Array.isArray(saved.markets) && saved.markets.length) return saved;
    if (Array.isArray(saved.vendors) && saved.vendors.length) {
      return {
        markets: [{ id: uid(), name: "", vendors: saved.vendors }],
        currentMarket: 0,
        current: saved.current || 0
      };
    }
    return null;
  }
  var FAB_SIZE = 62;
  /* 동그란 버튼 위치. 화면 오른쪽·아래에서 몇 px 인지로 기억한다 */
  function placeFab() {
    var el = document.getElementById("transBtn");
    if (!el) return;
    var pos = (state && state.fab) || { r: 16, b: 78 };
    var open = document.body.classList.contains("trans-open");
    var w = window.innerWidth, h = window.innerHeight;
    var r = Math.min(Math.max(pos.r, 8), Math.max(8, w - FAB_SIZE - 8));
    /* 번역 화면에서는 아래 마이크 동그라미를 가리지 않게 띄워준다 */
    var low = open ? 200 : 74;
    var b = Math.min(Math.max(pos.b, low), Math.max(low, h - FAB_SIZE - 72));
    el.style.right = r + "px";
    el.style.bottom = b + "px";
  }
  function paintFab() {
    var el = document.getElementById("transBtn");
    if (!el) return;
    el.textContent = document.body.classList.contains("trans-open") ? "✕" : "🎤";
    placeFab();
  }

  function normalize(s) {
    s.markets.forEach(function (m) {
      if (!Array.isArray(m.vendors) || !m.vendors.length) m.vendors = [newVendor()];
      if (typeof m.name !== "string") m.name = "";
      m.vendors.forEach(function (v) {
        if (!Array.isArray(v.items)) v.items = [];
        if (!v.currency) v.currency = "KRW";
        if (typeof v.name !== "string") v.name = "";
        /* 예전 형식: 명함/물건 사진이 한 장씩이던 것을 여러 장 배열로 */
        if (!Array.isArray(v.cards)) v.cards = v.card ? [v.card] : [];
        delete v.card;
        v.items.forEach(function (it) {
          if (!Array.isArray(it.photos)) it.photos = it.photo ? [it.photo] : [];
          delete it.photo;
        });
        /* 예전에 만들어진 페이지(물건 1칸)도 기본 2칸이 되도록 빈 칸을 채운다 */
        while (v.items.length < INITIAL_ITEMS) v.items.push(newItem());
      });
    });
    if (!s.fab || typeof s.fab.r !== "number" || typeof s.fab.b !== "number") s.fab = { r: 16, b: 78 };
    s.currentMarket = Math.max(0, Math.min(s.markets.length - 1, s.currentMarket || 0));
    s.current = Math.max(0, Math.min(s.markets[s.currentMarket].vendors.length - 1, s.current || 0));
    if (!s.lastCurrency) {
      var cur = s.markets[s.currentMarket].vendors[s.current];
      s.lastCurrency = (cur && cur.currency) || "KRW";
    }
    return s;
  }

  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      dbPut("kv", "state", JSON.parse(JSON.stringify(state)));
    }, 250);
  }

  /* ────────── 사진 처리 ────────── */
  var MAX_DIM = 1400, QUALITY = 0.82;

  function loadBitmap(file) {
    if (typeof createImageBitmap === "function") {
      return createImageBitmap(file, { imageOrientation: "from-image" })["catch"](function () {
        return createImageBitmap(file);
      })["catch"](loadViaImg.bind(null, file));
    }
    return loadViaImg(file);
  }
  function loadViaImg(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("이미지를 읽을 수 없습니다")); };
      img.src = url;
    });
  }

  function compress(file) {
    return loadBitmap(file).then(function (src) {
      var w = src.width || src.naturalWidth;
      var h = src.height || src.naturalHeight;
      var scale = Math.min(1, MAX_DIM / Math.max(w, h));
      var cw = Math.max(1, Math.round(w * scale));
      var ch = Math.max(1, Math.round(h * scale));
      var canvas = document.createElement("canvas");
      canvas.width = cw; canvas.height = ch;
      canvas.getContext("2d").drawImage(src, 0, 0, cw, ch);
      if (src.close) src.close();
      return new Promise(function (resolve) {
        if (canvas.toBlob) {
          canvas.toBlob(function (blob) { resolve(blob || dataURLtoBlob(canvas.toDataURL("image/jpeg", QUALITY))); }, "image/jpeg", QUALITY);
        } else {
          resolve(dataURLtoBlob(canvas.toDataURL("image/jpeg", QUALITY)));
        }
      });
    });
  }

  function dataURLtoBlob(dataURL) {
    var parts = dataURL.split(",");
    var mime = /:(.*?);/.exec(parts[0])[1];
    var bin = atob(parts[1]);
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }
  function blobToDataURL(blob) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(r.result); };
      r.onerror = function () { reject(r.error); };
      r.readAsDataURL(blob);
    });
  }

  function storePhoto(file) {
    return compress(file).then(function (blob) {
      var id = uid();
      return dbPut("images", id, blob).then(function () {
        urlCache[id] = URL.createObjectURL(blob);
        return id;
      });
    });
  }
  function dropPhoto(id) {
    if (!id) return;
    if (urlCache[id]) { URL.revokeObjectURL(urlCache[id]); delete urlCache[id]; }
    dbDel("images", id);
  }
  function ensureURLs(ids) {
    var missing = ids.filter(function (id) { return id && !urlCache[id]; });
    return Promise.all(missing.map(function (id) {
      return dbGet("images", id).then(function (blob) {
        if (blob) urlCache[id] = URL.createObjectURL(blob);
      });
    }));
  }

  /* ────────── 유틸 ────────── */

  /* ────────── 언어 (한국어 / English) ────────── */
  var I18N = {
    ko: {
      title: "아이템 소싱 노트",
      menuAria: "메뉴", phraseAria: function (n) { return n + "로 물어보기"; }, addVendor: "+ 업체",
      marketTag: "시장", marketPlaceholder: "시장 이름 (예: 이우시장)",
      marketBtn: function (i, n) { return "시장 " + i + "/" + n + " ▾"; },
      cardBlock: "명함 · 업체 정보",
      sayCardAria: function (n) { return n + "로 명함 요청하기"; },

      sayMoqAria: function (n) { return n + "로 최소수량 물어보기"; },
      vendorChip: function (n) { return "업체 " + n; },

      vendorNameHint: function (auto) { return auto + " (안 쓰면 자동)"; },
      currency: "통화",
      itemChip: function (n) { return "물건 " + n; },
      delBtn: "✕ 삭제", price: "가격", moq: "최소수량", memo: "메모",
      memoHint: "색상, 옵션, 납기, 샘플 여부 등", moqUnit: "개",
      cardShoot: "명함 사진 촬영", itemShoot: "물건 사진 촬영", addPhoto: "사진 추가",
      photoDelAria: "이 사진 삭제",
      noItems: "아직 등록된 물건이 없습니다.", addItem: "+ 물건 추가",
      vendorAuto: function (n) { return "업체 " + n; },
      marketAuto: function (n) { return "시장 " + n; },

      storageWarn: "저장 공간을 쓸 수 없어 임시로 동작합니다",
      xlsxMaking: "엑셀 파일 만드는 중…", xlsxSaved: "엑셀 파일을 저장했습니다", xlsxFailed: "엑셀 저장에 실패했습니다",

      needCardFirst: "먼저 명함 사진을 넣어주세요", qrSearching: "명함에서 QR 찾는 중…",
      qrNotFound: "QR을 찾지 못했습니다", qrSame: "이미 저장된 QR입니다",
      qrFound: function (label) { return label + "를 찾았습니다"; },

      delPhotoAsk: "이 사진을 삭제할까요?",

      for (var h = 0; h < hints.length; h++) {
        if (vl.indexOf(hints[h]) > -1) return list[i];
      }
      if (!fallback) fallback = list[i];
    }
    return fallback;
  }
  function refreshVoices() {
    VOICE_CODES.forEach(function (c) { sayVoices[c] = pickVoice(c); });
  }
  if (window.speechSynthesis) {
    try {
      refreshVoices();
      speechSynthesis.onvoiceschanged = refreshVoices;
    } catch (e) {}
  }

  function speakIn(text, code) {
    if (!text || !window.speechSynthesis || !window.SpeechSynthesisUtterance) return false;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = VOICE_TAG[code] || "zh-CN";
      if (!sayVoices[code]) sayVoices[code] = pickVoice(code);
      /* 목소리 지정이 실패해도(브라우저마다 다름) 읽기 자체는 계속되도록 */
      if (sayVoices[code]) { try { u.voice = sayVoices[code]; } catch (e) {} }
      u.rate = code === "zh" ? 0.85 : 0.9;
      speechSynthesis.speak(u);
      return true;
    } catch (e) {
      return false;
    }
  }
  function speakSay(text) { return speakIn(text, talk); }

  /* 소리가 안 들리는 시장에서도 쓰도록 문장을 크게 띄워 보여준다 */
  function openPhrase(key) {
    var ph = PHRASES[key];
    if (!ph) return;
    var say = phSay(ph);
    var spoken = speakSay(say);
    /* 목소리 목록을 읽을 수 있는데 해당 언어가 없을 때만 안내한다 (목록이 비면 아직 로딩 중일 수 있음) */
    var voices = (window.speechSynthesis && speechSynthesis.getVoices) ? (speechSynthesis.getVoices() || []) : [];
    var noVoice = !spoken || (voices.length > 0 && !sayVoices[talk]);
    var read = phRead(ph);
    var mean = phMean(ph);

    var back = document.createElement("div");
    back.className = "backdrop center";
    back.innerHTML = '<div class="phrase">' +
      '<div class="zh' + (talk === "en" ? " en" : "") + '">' + esc(say) + '</div>' +
      (read ? '<div class="pinyin">' + esc(read) + '</div>' : "") +
      (mean ? '<div class="ko">' + esc(mean) + '</div>' : "") +
      '<div class="note">' + (noVoice ? t("noteNoVoice", talkName()) : t("noteQuiet")) + '</div>' +
      '<div class="btns">' +
        '<button data-close="1">' + esc(t("close")) + '</button>' +
        '<button class="primary" data-again="1">' + esc(t("again")) + '</button>' +
      '</div></div>';

    back.addEventListener("click", function (e) {
      if (e.target.closest("[data-again]")) { speakSay(say); return; }
      if (e.target.closest("[data-close]") || e.target === back) {
        if (window.speechSynthesis) { try { speechSynthesis.cancel(); } catch (err) {} }
        back.remove();
      }
    });
    document.body.appendChild(back);
  }

  function openPhraseList() {
    var back = document.createElement("div");
    back.className = "backdrop";

    /* 말 거는 언어를 목록 맨 위에서 바로 바꿀 수 있게 해둔다 */
    function draw() {
      var html = '<div class="sheet">' +
        '<div class="seg">' + TALKS.map(function (l) {
          return '<button data-talk="' + l.code + '"' + (l.code === talk ? ' class="on"' : "") + '>' + esc(l.name) + '</button>';
        }).join("") + '</div>' +
        '<button class="sheet-item" data-talkbtn="1"><span class="grow">' + esc(t("menuTalk")) + '</span><span class="sub">🎤</span></button>';
      PHRASE_GROUPS.forEach(function (g) {
        html += '<h3>' + esc(t(g.title)) + '</h3>';
        g.keys.forEach(function (k) {
          var ph = PHRASES[k];
          if (!ph) return;
          var sub = phMean(ph) || phRead(ph);
          html += '<button class="sheet-item phrase-row" data-phrase="' + esc(k) + '">' +
            '<span class="grow"><b>' + esc(phSay(ph)) + '</b>' +
            (sub ? '<br><span class="sub">' + esc(sub) + '</span>' : "") + '</span>' +
            '<span class="sub">🔊</span></button>';
        });
      });
      back.innerHTML = html + '</div>';
    }
    draw();

    back.addEventListener("click", function (e) {
      var seg = e.target.closest("[data-talk]");
      if (seg) { setTalk(seg.dataset.talk); draw(); return; }
      if (e.target.closest("[data-talkbtn]")) { back.remove(); openTranslator(); return; }
      var row = e.target.closest("[data-phrase]");
      if (row) { openPhrase(row.dataset.phrase); return; }   /* 목록은 열어둔 채 카드만 띄운다 */
      if (e.target === back) back.remove();
    });
    document.body.appendChild(back);
  }

  document.getElementById("phraseBtn").addEventListener("click", openPhraseList);
  var closeTranslator = null;          /* 번역 화면이 열려 있으면 닫는 함수가 들어간다 */
  function toggleTranslator() {
    if (closeTranslator) closeTranslator();
    else openTranslator();
  }

  /* 동그란 버튼: 톡 누르면 번역 화면 열기/닫기, 꾹 누르면 집어서 옮기기 */
  (function () {
    var fab = document.getElementById("transBtn");
    if (!window.PointerEvent) {
      fab.addEventListener("click", toggleTranslator);
      return;
    }
    var timer = null, pid = null, dragging = false, moved = false;
    var startX = 0, startY = 0, baseR = 0, baseB = 0;

    fab.addEventListener("pointerdown", function (e) {
      if (e.button !== undefined && e.button !== 0) return;
      e.preventDefault();
      pid = e.pointerId;
      startX = e.clientX; startY = e.clientY;
      dragging = false; moved = false;
      baseR = parseFloat(fab.style.right) || parseFloat(getComputedStyle(fab).right) || 16;
      baseB = parseFloat(fab.style.bottom) || parseFloat(getComputedStyle(fab).bottom) || 78;
      try { fab.setPointerCapture(pid); } catch (err) {}
      timer = setTimeout(function () {
        dragging = true;
        fab.classList.add("drag");
      }, 400);
    });

    fab.addEventListener("pointermove", function (e) {
      if (pid === null) return;
      var dx = e.clientX - startX, dy = e.clientY - startY;
      if (!dragging) {
        if (Math.abs(dx) > 10 || Math.abs(dy) > 10) { moved = true; clearTimeout(timer); }
        return;
      }
      e.preventDefault();
      state.fab = { r: baseR - dx, b: baseB - dy };
      placeFab();
    });

    function finish() {
      if (pid === null) return;
      clearTimeout(timer);
      var wasDrag = dragging;
      pid = null; dragging = false;
      fab.classList.remove("drag");
      if (wasDrag) {
        /* 화면 밖으로 나가지 않게 다듬은 자리를 그대로 저장한다 */
        state.fab = { r: parseFloat(fab.style.right) || 16, b: parseFloat(fab.style.bottom) || 78 };
        save();
        return;
      }
      if (!moved) toggleTranslator();
    }
    fab.addEventListener("pointerup", finish);
    fab.addEventListener("pointercancel", finish);
    fab.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  })();
  window.addEventListener("resize", placeFab);

  /* ────────── 대화 번역 ────────── */
  /* 번역은 이 폰에서 바로 부른다. 크롬에 번역기가 내장돼 있으면 그걸 먼저 쓰고(공짜·빠름),
     없으면 공개 번역 API로 넘어간다. 내 번역 서버가 생기면 TRANS_ENDPOINT 에 주소만 넣으면 된다. */
  var TRANS_ENDPOINT = "";
  var MM_LANG = { ko: "ko", en: "en", ja: "ja", vi: "vi", zh: "zh-CN" };
  var transCache = {};

  function withTimeout(p, ms) {
    return new Promise(function (resolve, reject) {
      var done = false;
      var timer = setTimeout(function () { if (!done) { done = true; reject(new Error("timeout")); } }, ms);
      Promise.resolve(p).then(function (v) {
        if (done) return;
        done = true; clearTimeout(timer); resolve(v);
      }, function (e) {
        if (done) return;
        done = true; clearTimeout(timer); reject(e);
      });
    });
  }

  /* 크롬 내장 번역기. 번역팩이 이미 폰에 깔려 있을 때만 쓴다 —
     안 깔려 있으면 create() 가 몇 분씩 다운로드를 붙들고 있어서 시장에서 멈춘 것처럼 보인다 */
  var builtinReady = {};
  function builtinCheck(from, to) {
    var key = from + ">" + to;
    if (builtinReady[key] !== undefined) return Promise.resolve(builtinReady[key]);
    var api = window.Translator || window.translation || null;
    var ask = null;
    try {
      if (api && typeof api.availability === "function") ask = api.availability({ sourceLanguage: from, targetLanguage: to });
      else if (api && typeof api.canTranslate === "function") ask = api.canTranslate({ sourceLanguage: from, targetLanguage: to });
    } catch (e) { ask = null; }
    if (!ask) { builtinReady[key] = false; return Promise.resolve(false); }
    return withTimeout(Promise.resolve(ask), 2500).then(function (v) {
      v = String(v || "");
      builtinReady[key] = (v === "available" || v === "readily");
      return builtinReady[key];
    })["catch"](function () { builtinReady[key] = false; return false; });
  }
  function builtinTranslate(text, from, to) {
    return builtinCheck(from, to).then(function (ok) {
      if (!ok) throw new Error("no-builtin");
      var api = window.Translator || window.translation;
      var maker = api.create ? api.create({ sourceLanguage: from, targetLanguage: to })
                             : api.createTranslator({ sourceLanguage: from, targetLanguage: to });
      return withTimeout(Promise.resolve(maker).then(function (tr) { return tr.translate(text); }), 6000);
    });
  }

  function grab(url) {
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error("http " + r.status);
      return r.json();
    });
  }

  /* 내 번역 서버 (주소를 넣어두면 여기부터 쓴다) */
  function myServerTranslate(text, from, to) {
    var base = (state && state.transUrl) || TRANS_ENDPOINT;
    if (!base) return Promise.reject(new Error("no-server"));
    var url = base + (base.indexOf("?") > -1 ? "&" : "?") +
      "q=" + encodeURIComponent(text) + "&source=" + encodeURIComponent(from) + "&target=" + encodeURIComponent(to);
    return grab(url).then(function (d) {
      var out = (d && (d.translatedText || d.translation || d.text)) || "";
      if (!out && d && d.data && d.data.translations && d.data.translations[0]) out = d.data.translations[0].translatedText;
      if (!out) throw new Error("bad");
      return out;
    });
  }

  /* 구글 번역 — 무료 번역 중에는 품질이 제일 낫다 */
  function googleTranslate(text, from, to) {
    var url = "https://translate.googleapis.com/translate_a/single?client=gtx&dt=t" +
      "&sl=" + encodeURIComponent(MM_LANG[from] || from) +
      "&tl=" + encodeURIComponent(MM_LANG[to] || to) +
      "&q=" + encodeURIComponent(text);
    return grab(url).then(function (d) {
      if (!d || !d[0] || !d[0].length) throw new Error("bad");
      var out = "";
      for (var i = 0; i < d[0].length; i++) {
        if (d[0][i] && d[0][i][0]) out += d[0][i][0];
      }
      if (!out) throw new Error("empty");
      return out;
    });
  }

  function memoryTranslate(text, from, to) {
    var url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) +
      "&langpair=" + encodeURIComponent((MM_LANG[from] || from) + "|" + (MM_LANG[to] || to));
    return grab(url).then(function (d) {
      var out = (d && d.responseData && d.responseData.translatedText) || "";
      /* 한도를 넘기면 번역문 자리에 경고문이 온다 */
      if (!out || /MYMEMORY WARNING|QUERY LENGTH|INVALID|PLEASE SELECT/i.test(out)) throw new Error("bad");
      return out;
    });
  }

  function translateText(text, from, to) {
    text = String(text || "").trim();
    if (!text) return Promise.reject(new Error("empty"));
    if (from === to) return Promise.resolve(text);
    var key = from + ">" + to + ">" + text;
    if (transCache[key]) return Promise.resolve(transCache[key]);
    /* 잘 되는 번역기를 차례로 시도한다. 인터넷이 없으면 폰에 깔린 번역팩만 */
    var chain = [];
    if ((state && state.transUrl) || TRANS_ENDPOINT) chain.push(myServerTranslate);
    if (navigator.onLine !== false) { chain.push(googleTranslate); chain.push(memoryTranslate); }
    chain.push(builtinTranslate);

    var step = function (i) {
      if (i >= chain.length) return Promise.reject(new Error(navigator.onLine === false ? "offline" : "fail"));
      return withTimeout(chain[i](text, from, to), 10000).then(function (out) {
        out = String(out || "").trim();
        if (!out) throw new Error("empty");
        return out;
      })["catch"](function () { return step(i + 1); });
    };
    return step(0).then(function (out) {
      transCache[key] = out;
      return out;
    });
  }

  /* 음성 인식. 브라우저가 지원할 때만 쓰고, 안 되면 직접 입력으로 넘긴다 */
  function listen(tag, on) {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { on.error("nosupport"); return null; }
    if (window.speechSynthesis) { try { speechSynthesis.cancel(); } catch (e) {} }
    var rec;
    try { rec = new SR(); } catch (e) { on.error("nosupport"); return null; }
    rec.lang = tag;
    rec.interimResults = true;
    rec.maxAlternatives = 1;
    rec.continuous = true;          /* 버튼을 누르고 있는 동안 계속 듣는다 */
    var fin = "", heard = "", failed = false;
    rec.onresult = function (e) {
      var live = "";
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var r = e.results[i];
        if (r.isFinal) fin += r[0].transcript;
        else live += r[0].transcript;
      }
      heard = (fin + live).trim();
      on.partial(heard);
    };
    rec.onerror = function (e) { failed = true; on.error((e && e.error) || "error"); };
    /* 손을 뗀 순간 확정 결과가 아직 없을 수 있어, 듣고 있던 말이라도 쓴다 */
    rec.onend = function () { if (!failed) on.done((fin.trim() || heard).trim()); };
    try { rec.start(); } catch (e) { failed = true; on.error("busy"); return null; }
    return rec;
  }

  function myLangName() {
    for (var i = 0; i < LANGS.length; i++) { if (LANGS[i].code === lang) return LANGS[i].name; }
    return lang;
  }
  function talkLangName() {
    for (var i = 0; i < TALKS.length; i++) { if (TALKS[i].code === talk) return TALKS[i].name; }
    return talk;
  }

  function openTranslator() {
    var log = [];
    var rec = null, listening = "", side = "me";

    var back = document.createElement("div");
    back.className = "trans-back";
    back.innerHTML =
      '<div class="trans-bar">' +
        '<button class="mini" data-shut="1">' + esc(t("close")) + '</button>' +
        '<div class="trans-pair">' + esc(myLangName() + " ⇄ " + talkLangName()) + '</div>' +
        '<button class="mini" data-clear="1">' + esc(t("transClear")) + '</button>' +
      '</div>' +
      '<div class="trans-body"></div>' +
      '<div class="trans-type">' +
        '<button class="side" data-side="1"></button>' +
        '<input class="input" type="text" placeholder="' + esc(t("transTyping")) + '" autocomplete="off">' +
        '<button class="send" data-send="1">' + esc(t("transSend")) + '</button>' +
      '</div>' +
      '<div class="trans-foot">' +
        '<button class="mic" data-mic="me"><span class="dot">🎤</span><span class="lab"></span></button>' +
        '<button class="mic" data-mic="you"><span class="dot">🎤</span><span class="lab"></span></button>' +
      '</div>';

    var body = back.querySelector(".trans-body");
    var pair = back.querySelector(".trans-pair");
    var input = back.querySelector(".trans-type .input");
    var sideBtn = back.querySelector("[data-side]");
    var micMe = back.querySelector('[data-mic="me"]');
    var micYou = back.querySelector('[data-mic="you"]');

    function drawButtons() {
      pair.textContent = listening ? t("transListening") : (myLangName() + " ⇄ " + talkLangName());
      sideBtn.textContent = side === "me" ? myLangName() : talkLangName();
      micMe.querySelector(".lab").textContent = myLangName();
      micYou.querySelector(".lab").textContent = talkLangName();
      micMe.className = "mic" + (listening === "me" ? " on" : "");
      micYou.className = "mic" + (listening === "you" ? " on" : "");
    }

    function draw() {
      if (!log.length) {
        body.innerHTML = '<div class="trans-empty">' + esc(t("transEmpty")) + '</div>';
        return;
      }
      body.innerHTML = log.map(function (m, i) {
        return '<div class="bub ' + (m.mine ? "me" : "you") + (m.state === "ok" ? "" : " " + m.state) + '">' +
          '<div class="src">' + esc(m.src) + '</div>' +
          '<div class="dst">' + esc(m.state === "wait" ? "…" : m.dst) + '</div>' +
          (m.state === "ok" ?
            '<div class="acts">' +
              '<button data-say="' + i + '">🔊</button>' +
              '<button data-big="' + i + '">⤢</button>' +
              '<button data-memo="' + i + '">📌</button>' +
            '</div>' : "") +
          (m.state === "fail" ? '<div class="acts"><button data-retry="' + i + '">↻</button></div>' : "") +
          '</div>';
      }).join("");
      body.scrollTop = body.scrollHeight;
    }

    function run(m) {
      m.state = "wait";
      draw();
      translateText(m.src, m.from, m.to).then(function (out) {
        m.dst = out;
        m.state = "ok";
        draw();
        speakIn(out, m.to);
      })["catch"](function (e) {
        m.state = "fail";
        m.dst = (navigator.onLine === false || String((e && e.message) || "") === "offline") ? t("transOffline") : t("transFail");
        draw();
      });
    }

    function push(mine, text) {
      var m = { mine: mine, src: text, dst: "", from: mine ? lang : talk, to: mine ? talk : lang, state: "wait" };
      log.push(m);
      run(m);
      return m;
    }

    function micError(kind) {
      if (kind === "not-allowed" || kind === "service-not-allowed") return t("transDenied");
      if (kind === "no-speech" || kind === "aborted") return t("transNoSpeech");
      if (kind === "nosupport") return t("transNoMic");
      if (kind === "network") return t("transOffline");
      return t("transFail");
    }

    var dropDraft = null;          /* 지금 듣고 있는 말풍선을 버리는 함수 */
    function stopMic() {
      if (rec) { try { rec.stop(); } catch (e) {} }   /* 멈추면 onend 에서 번역으로 넘어간다 */
    }
    function cancelMic() {
      if (dropDraft) dropDraft();
      if (rec) { try { rec.abort ? rec.abort() : rec.stop(); } catch (e) {} rec = null; }
      listening = "";
      drawButtons();
    }

    function startMic(which) {
      cancelMic();
      var mine = which === "me";
      var from = mine ? lang : talk;
      var draft = null;
      listening = which;
      drawButtons();

      function drop() {
        if (!draft) return;
        var at = log.indexOf(draft);
        if (at > -1) log.splice(at, 1);
        draft = null;
        draw();
      }
      dropDraft = drop;

      rec = listen(VOICE_TAG[from] || "zh-CN", {
        partial: function (txt) {
          if (!txt) return;
          if (!draft) {
            draft = { mine: mine, src: txt, dst: "", from: from, to: mine ? talk : lang, state: "wait" };
            log.push(draft);
          }
          draft.src = txt;
          draw();
        },
        error: function (kind) {
          drop();
          rec = null; listening = ""; dropDraft = null; drawButtons();
          if (kind !== "aborted") toast(micError(kind));
        },
        done: function (txt) {
          rec = null; listening = ""; dropDraft = null; drawButtons();
          if (!txt) { drop(); toast(t("transNoSpeech")); return; }
          if (!draft) {
            draft = { mine: mine, src: txt, dst: "", from: from, to: mine ? talk : lang, state: "wait" };
            log.push(draft);
          }
          draft.src = txt;
          run(draft);
        }
      });
      if (!rec) { listening = ""; drawButtons(); }
    }

    function appendMemo(it, line) {
      if (!it) return;
      it.memo = (it.memo ? it.memo + "\n" : "") + line;
      save();
      render();
      toast(t("transSaved"));
    }

    /* 나눈 말을 그 자리에서 업체 메모로 남긴다 — 이게 통역 앱과 다른 점 */
    function saveMemo(m) {
      var v = vendor();
      var line = m.mine ? m.src : (m.dst + " (" + m.src + ")");
      var items = v.items || [];
      if (items.length <= 1) { appendMemo(items[0], line); return; }
      var pick = document.createElement("div");
      pick.className = "backdrop over";
      pick.innerHTML = '<div class="sheet"><h3>' + esc(t("transPick")) + '</h3>' +
        items.map(function (it, i) {
          var sub = String(it.memo || it.price || "").split("\n")[0];
          return '<button class="sheet-item" data-pick="' + i + '"><span class="grow">' +
            esc(t("itemChip", i + 1) + (sub ? " · " + sub : "")) + '</span></button>';
        }).join("") + '</div>';
      pick.addEventListener("click", function (e) {
        var row = e.target.closest("[data-pick]");
        if (row) { pick.remove(); appendMemo(items[+row.dataset.pick], line); return; }
        if (e.target === pick) pick.remove();
      });
      document.body.appendChild(pick);
    }

    function bigCard(m) {
      var card = document.createElement("div");
      card.className = "backdrop over center";
      card.innerHTML = '<div class="phrase">' +
        '<div class="zh' + (m.to === "en" ? " en" : "") + '">' + esc(m.dst) + '</div>' +
        '<div class="ko">' + esc(m.src) + '</div>' +
        '<div class="note">' + t("noteQuiet") + '</div>' +
        '<div class="btns">' +
          '<button data-x="1">' + esc(t("close")) + '</button>' +
          '<button class="primary" data-again="1">' + esc(t("again")) + '</button>' +
        '</div></div>';
      card.addEventListener("click", function (e) {
        if (e.target.closest("[data-again]")) { speakIn(m.dst, m.to); return; }
        if (e.target.closest("[data-x]") || e.target === card) {
          if (window.speechSynthesis) { try { speechSynthesis.cancel(); } catch (err) {} }
          card.remove();
        }
      });
      document.body.appendChild(card);
      speakIn(m.dst, m.to);
    }

    function sendTyped() {
      var text = input.value.trim();
      if (!text) return;
      input.value = "";
      push(side === "me", text);
    }

    function close() {
      cancelMic();
      if (window.speechSynthesis) { try { speechSynthesis.cancel(); } catch (e) {} }
      document.removeEventListener("keydown", onKey);
      document.body.classList.remove("has-overlay");
      document.body.classList.remove("trans-open");
      back.remove();
      closeTranslator = null;
      paintFab();
    }
    function onKey(e) { if (e.key === "Escape") close(); }

    back.addEventListener("click", function (e) {
      if (e.target.closest("[data-shut]")) { close(); return; }
      if (e.target.closest("[data-clear]")) { log = []; draw(); return; }
      if (e.target.closest("[data-side]")) { side = side === "me" ? "you" : "me"; drawButtons(); input.focus(); return; }
      if (e.target.closest("[data-send]")) { sendTyped(); return; }
      var say = e.target.closest("[data-say]");
      if (say) { var a = log[+say.dataset.say]; if (a) speakIn(a.dst, a.to); return; }
      var big = e.target.closest("[data-big]");
      if (big) { var b = log[+big.dataset.big]; if (b) bigCard(b); return; }
      var memo = e.target.closest("[data-memo]");
      if (memo) { var c = log[+memo.dataset.memo]; if (c) saveMemo(c); return; }
      var again = e.target.closest("[data-retry]");
      if (again) { var d = log[+again.dataset.retry]; if (d) run(d); return; }
    });
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") sendTyped(); });

    /* 꾹 누르고 있는 동안 듣고, 손을 떼면 멈춘다 */
    var holdAt = 0;
    function bindHold(btn, which) {
      function press(e) {
        if (e.button !== undefined && e.button !== 0) return;
        e.preventDefault();
        if (listening) return;
        holdAt = Date.now();
        if (btn.setPointerCapture && e.pointerId !== undefined) {
          try { btn.setPointerCapture(e.pointerId); } catch (err) {}
        }
        startMic(which);
      }
      function release(e) {
        if (listening !== which) return;
        if (e) e.preventDefault();
        var held = Date.now() - holdAt;
        if (held < 400) { cancelMic(); toast(t("transHold")); return; }
        stopMic();
      }
      if (window.PointerEvent) {
        btn.addEventListener("pointerdown", press);
        btn.addEventListener("pointerup", release);
        btn.addEventListener("pointercancel", release);
      } else {
        btn.addEventListener("touchstart", press);
        btn.addEventListener("touchend", release);
        btn.addEventListener("touchcancel", release);
        btn.addEventListener("mousedown", press);
        btn.addEventListener("mouseup", release);
        btn.addEventListener("mouseleave", release);
      }
      btn.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    }
    bindHold(micMe, "me");
    bindHold(micYou, "you");

    document.addEventListener("keydown", onKey);

    drawButtons();
    draw();
    document.body.classList.add("has-overlay", "trans-open");
    document.body.appendChild(back);
    closeTranslator = close;
    paintFab();
  }


  /* ────────── 렌더 ────────── */
  var page = document.getElementById("page");

  /* 사진 여러 장을 옆으로 밀어 넘기는 띠 (맨 끝은 추가 타일) */
  function photoStrip(kind, target, ids, hint) {
    ids = ids || [];
    var tiles = ids.map(function (id, i) {
      var url = urlCache[id];
      return '<div class="shot filled" data-view="' + esc(id) + '">' +
        (url ? '<img src="' + esc(url) + '" alt="">' : "") +
        '<span class="shot-no">' + (i + 1) + ' / ' + ids.length + '</span>' +
        '<button class="shot-del" data-del-photo="' + esc(target + ":" + i) + '" aria-label="' + esc(t("photoDelAria")) + '">✕</button>' +
        '</div>';
    }).join("");

    tiles += '<div class="shot add" data-shoot="' + esc(target) + '">' +
      '<div class="cam">📷</div>' +
      '<div class="hint">' + (ids.length ? esc(t("addPhoto")) : esc(hint)) + '</div></div>';

    return '<div class="strip ' + kind + (ids.length ? "" : " empty") + '">' + tiles + '</div>';
  }

  /* 명함 아래 QR 링크 줄 */
  function cardQrRow(v) {
    if (v.cardQr) {
      var link = /^https?:\/\//i.test(v.cardQr);
      return '<div class="qr-row">' +
        '<div class="qr-info"><span class="qr-tag">' + esc(qrLabel(v.cardQr)) + '</span>' +
        '<span class="qr-text">' + esc(shortText(v.cardQr, 34)) + '</span></div>' +
        '<div class="qr-btns">' +
          (link ? '<button class="qr-btn primary" data-qr="open">' + esc(t("open")) + '</button>' : "") +
          '<button class="qr-btn" data-qr="copy">' + esc(t("copy")) + '</button>' +
          '<button class="qr-btn" data-qr="clear" aria-label="' + esc(t("qrDelAria")) + '">✕</button>' +
        '</div></div>';
    }
    if (!v.cards.length) return "";
    return '<div class="qr-row"><button class="qr-btn wide" data-qr="scan">' + esc(t("qrScan")) + '</button></div>';
  }

  function render() {
    if (!state.markets.length) state.markets.push(newMarket());
    state.currentMarket = Math.max(0, Math.min(state.markets.length - 1, state.currentMarket));
    if (!vendors().length) vendors().push(newVendor());
    state.current = Math.max(0, Math.min(vendors().length - 1, state.current));

    var v = vendor();
    var ids = v.cards.slice();
    v.items.forEach(function (it) { ids = ids.concat(it.photos); });

    return ensureURLs(ids).then(function () {
      var html = "";
      var m = market();

      /* 시장(카테고리) — 한 번만 입력하면 이 시장의 모든 업체 페이지에 따라다닌다 */
      html += '<section class="market-bar">' +
        '<span class="market-tag">' + esc(t("marketTag")) + '</span>' +
        '<input class="market-input" type="text" data-field="market" placeholder="' + esc(t("marketPlaceholder")) + '" value="' + esc(m.name) + '">' +
        '<button class="market-more" data-market-menu="1">' +
          esc(t("marketBtn", state.currentMarket + 1, state.markets.length)) + '</button>' +
        '</section>';

      /* 명함 블록 */
      html += '<section class="block vendor-head">' +
        '<div class="block-label">' +
          '<span class="label-say">' + esc(t("cardBlock")) +
            '<button class="say" data-say="card" aria-label="' + esc(t("sayCardAria", talkName())) + '">🔊</button></span>' +
          '<span class="num">' + esc(t("vendorChip", state.current + 1)) + '</span></div>' +
        photoStrip("card", "card", v.cards, t("cardShoot")) +
        cardQrRow(v) +
        '<div class="field"><label>' + esc(t("vendorName")) + '</label>' +
          '<input class="input" type="text" data-field="name" placeholder="' +
            esc(t("vendorNameHint", vendorLabel(null, state.current))) + '" value="' + esc(v.name) + '"></div>' +
        '<div class="field"><label>' + esc(t("currency")) + '</label>' +
          '<select class="input" data-field="currency">' +
            Object.keys(CURRENCIES).map(function (k) {
              return '<option value="' + k + '"' + (v.currency === k ? " selected" : "") + '>' + esc(curLabel(k)) + '</option>';
            }).join("") +
          '</select></div>' +
        '</section>';

      /* 물건 블록 반복 */
      v.items.forEach(function (it, i) {
        html += '<section class="block" data-item="' + esc(it.id) + '">' +
          '<div class="block-label"><span class="num">' + esc(t("itemChip", i + 1)) + '</span>' +
            '<button class="del-btn" data-del-item="' + esc(it.id) + '">' + esc(t("delBtn")) + '</button></div>' +
          photoStrip("item", "item:" + it.id, it.photos, t("itemShoot")) +
          '<div class="row field">' +
            '<div><div class="label-row"><span>' + esc(t("price")) + sayTag("价格", "Price") + '</span>' +
              '<button class="say" data-say="price" aria-label="' + esc(t("sayPriceAria", talkName())) + '">🔊</button></div>' +
              '<div class="with-suffix">' +
              '<input class="input" type="text" inputmode="decimal" data-field="price" placeholder="0" value="' + esc(it.price) + '">' +
              '<span class="suffix">' + esc(curSuffix(v.currency)) + '</span></div></div>' +
            '<div><div class="label-row"><span>' + esc(t("moq")) + sayTag("起订量", "Min. order") + '</span>' +
              '<button class="say" data-say="moq" aria-label="' + esc(t("sayMoqAria", talkName())) + '">🔊</button></div>' +
              '<div class="with-suffix">' +
              '<input class="input" type="text" inputmode="numeric" data-field="moq" placeholder="0" value="' + esc(it.moq) + '">' +
              '<span class="suffix">' + esc(t("moqUnit")) + '</span></div></div>' +
          '</div>' +
          '<div class="field"><label>' + esc(t("memo")) + '</label>' +

      if (!v.items.length) {
        html += '<p class="empty-note">' + esc(t("noItems")) + '</p>';

      html += '<button class="add-item" data-add-item="1">' + esc(t("addItem")) + '</button>';

      page.innerHTML = html;
      page.querySelectorAll("textarea.input").forEach(autoGrow);

  function renderIndicator() {
    var m = market();
    var total = vendors().length;
    document.getElementById("indicator").innerHTML =
      '<b>' + esc(vendorLabel(vendor(), state.current)) + '</b><br>' +
      esc(marketLabel(m, state.currentMarket)) + " · " + esc(t("pageInfo", state.current + 1, total));
    document.querySelector('[data-nav="prev"]').disabled = state.current === 0;

  /* ────────── 입력 반영 ────────── */
  function itemOf(el) {
    var block = el.closest("[data-item]");
    if (!block) return null;
    var id = block.dataset.item;
    return vendor().items.filter(function (it) { return it.id === id; })[0] || null;
  }

  page.addEventListener("input", function (e) {
    var el = e.target;
    var field = el.dataset.field;
    if (!field) return;
    var it = itemOf(el);

    if (field === "market") {
      market().name = el.value;
      renderIndicator();
    } else if (field === "name") {
      vendor().name = el.value;
      renderIndicator();
    } else if (field === "price" || field === "moq") {
      var start = el.selectionStart, before = el.value;
      var formatted = formatNumber(el.value);
      if (formatted !== before) {
        el.value = formatted;
        var diff = formatted.length - before.length;
        try { el.setSelectionRange(Math.max(0, start + diff), Math.max(0, start + diff)); } catch (err) {}
      }
      if (it) it[field] = el.value;
    } else if (field === "memo") {
      if (it) it.memo = el.value;
      autoGrow(el);
    }
    save();
  });

  page.addEventListener("change", function (e) {
    if (e.target.dataset.field === "currency") {
      vendor().currency = e.target.value;
      state.lastCurrency = e.target.value;      /* 다음에 만드는 업체도 이 통화로 */
      save();
      render();
    }
  });

  /* ────────── 사진 촬영 ────────── */
  var pendingTarget = null;

  function pickPhoto(target) {
    pendingTarget = target;
    var back = document.createElement("div");
    back.className = "backdrop";
    back.innerHTML = '<div class="sheet"><h3>' + esc(t("photoSheet")) + '</h3>' +
      '<button class="sheet-item" data-src="camera"><span class="grow">' + esc(t("photoCamera")) + '</span></button>' +
      '<button class="sheet-item" data-src="album"><span class="grow">' + esc(t("photoAlbum")) + '</span></button>' +
      '<button class="sheet-item" data-src="cancel"><span class="grow" style="color:var(--muted)">' + esc(t("cancel")) + '</span></button></div>';
    back.addEventListener("click", function (e) {
      var btn = e.target.closest("[data-src]");
      if (!btn && e.target !== back) return;
      var src = btn ? btn.dataset.src : "cancel";
      back.remove();
      if (src === "camera") document.getElementById("fileCamera").click();
      else if (src === "album") document.getElementById("fileAlbum").click();
      else pendingTarget = null;
    });
    document.body.appendChild(back);
  }

  function handleFile(input) {
    var file = input.files && input.files[0];
    input.value = "";
    if (!file || !pendingTarget) { pendingTarget = null; return; }
    var target = pendingTarget;
    pendingTarget = null;
    var autoScan = null;
    toast(t("photoProcessing"));
    storePhoto(file).then(function (id) {
      var v = vendor();
      if (target === "card") {
        v.cards.push(id);
        autoScan = id;                       /* 새로 찍은 명함에서 QR 찾기 */
      } else {
        var itemId = target.slice(5);
        var it = v.items.filter(function (x) { return x.id === itemId; })[0];
        if (!it) { dropPhoto(id); return; }
        it.photos.push(id);
      }
      save();
      return render().then(function () {
        toast(t("photoSaved"));
        if (autoScan) scanCardPhoto(autoScan);   /* 명함이면 QR도 조용히 찾아본다 */
      });
    })["catch"](function () {
      toast(t("photoFailed"));
    });
  }

  document.getElementById("fileCamera").addEventListener("change", function () { handleFile(this); });
  document.getElementById("fileAlbum").addEventListener("change", function () { handleFile(this); });

  /* ────────── 페이지 클릭 동작 ────────── */
  page.addEventListener("click", function (e) {
    var say = e.target.closest("[data-say]");
    if (say) { openPhrase(say.dataset.say); return; }

    var qr = e.target.closest("[data-qr]");
    if (qr) {
      var act = qr.dataset.qr;
      var v = vendor();
      if (act === "scan") scanCardQR(true);
      else if (act === "open" && v.cardQr) window.open(v.cardQr, "_blank", "noopener");
      else if (act === "copy" && v.cardQr) copyToClipboard(v.cardQr, t("linkCopied"));
      else if (act === "clear") {
        confirmDialog(t("delQrAsk")).then(function (ok) {
          if (!ok) return;
          delete v.cardQr;
          save(); render();
        });
      }
      return;
    }
    if (e.target.closest("[data-market-menu]")) {
      document.getElementById("menuBtn").click();
      return;
    }
    var shoot = e.target.closest("[data-shoot]");
    if (shoot) { pickPhoto(shoot.dataset.shoot); return; }

    var del = e.target.closest("[data-del-photo]");
    if (del) {
      var parts = del.dataset.delPhoto.split(":");      /* card:2 또는 item:<id>:1 */
      var index = parseInt(parts[parts.length - 1], 10);
      var isCard = parts[0] === "card";
      confirmDialog(t("delPhotoAsk")).then(function (ok) {
        if (!ok) return;
        var v = vendor();
        var list = isCard ? v.cards
          : (v.items.filter(function (x) { return x.id === parts[1]; })[0] || {}).photos;
        if (!list || !list[index]) return;
        dropPhoto(list[index]);
        list.splice(index, 1);
        if (isCard && !list.length) delete v.cardQr;
        save(); render();
      });
      return;
    }

    var view = e.target.closest("[data-view]");
    if (view) { openViewer(view.dataset.view); return; }

    var delItem = e.target.closest("[data-del-item]");
    if (delItem) {
      var id = delItem.dataset.delItem;
      confirmDialog(t("delItemAsk")).then(function (ok) {
        if (!ok) return;
        var v = vendor();
        var it = v.items.filter(function (x) { return x.id === id; })[0];
        if (it) it.photos.forEach(dropPhoto);
        v.items = v.items.filter(function (x) { return x.id !== id; });
        save(); render();
      });
      return;
    }

    if (e.target.closest("[data-add-item]")) {
      vendor().items.push(newItem());
      save();
      render().then(function () {
        var blocks = page.querySelectorAll("[data-item]");
        var last = blocks[blocks.length - 1];
        if (last) last.scrollIntoView({ behavior: "smooth", block: "center" });
      });
    }
  });

  function openViewer(photoId) {

  /* ────────── 페이지(업체) 이동 ────────── */
  function goTo(index) {

    return render().then(function () { window.scrollTo(0, 0); });

  function goToMarket(index, vendorIndex) {

    state.current = 0;

  function addVendor() {
    vendors().push(newVendor(vendor().currency));
    goTo(vendors().length - 1);
    toast(t("vendorAdded"));
    /* 길을 기록하는 중이면 새 업체 자리도 같이 남겨둔다 */

  document.querySelector(".bottombar").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-nav]");
    if (!btn) return;
    goTo(state.current + (btn.dataset.nav === "next" ? 1 : -1));
