<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뽀모도로 & 할 일</title>
<style>
  :root {
    --bg: #f5f3ef;
    --card: #ffffff;
    --text: #2b2b2b;
    --muted: #8a8580;
    --accent: #e2634f;
    --accent-soft: #f6d9d3;
    --focus: #4f7ce2;
    --break: #4fae7c;
    --border: #e8e4dd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .app {
    width: 100%;
    max-width: 420px;
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 24px;
    text-align: center;
    letter-spacing: -0.02em;
  }
  .timer-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    margin-bottom: 20px;
    transition: background 0.3s;
  }
  .mode-tabs {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .mode-tab {
    border: none;
    background: var(--bg);
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mode-tab.active {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .time-display {
    font-size: 64px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
    margin: 8px 0 24px;
  }
  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .btn {
    border: none;
    border-radius: 12px;
    padding: 12px 22px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary {
    background: var(--accent);
    color: white;
  }
  .btn-secondary {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .session-count {
    margin-top: 16px;
    font-size: 12px;
    color: var(--muted);
  }
  .todo-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.04);
  }
  .todo-card h2 {
    font-size: 14px;
    margin: 0 0 14px;
    color: var(--muted);
    font-weight: 600;
  }
  .todo-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .todo-input-row input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  .todo-input-row input:focus {
    border-color: var(--accent);
  }
  .todo-input-row button {
    border: none;
    background: var(--text);
    color: white;
    border-radius: 10px;
    padding: 0 16px;
    font-size: 18px;
    cursor: pointer;
  }
  .todo-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .todo-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 8px;
    border-radius: 10px;
    transition: background 0.15s;
  }
  .todo-item:hover {
    background: var(--bg);
  }
  .todo-item.active-task {
    background: var(--accent-soft);
  }
  .todo-item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  .todo-item .label {
    flex: 1;
    font-size: 14px;
    cursor: pointer;
  }
  .todo-item.done .label {
    text-decoration: line-through;
    color: var(--muted);
  }
  .todo-item .pomo-count {
    font-size: 11px;
    color: var(--muted);
    flex-shrink: 0;
  }
  .todo-item .del-btn {
    border: none;
    background: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 6px;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .todo-item:hover .del-btn {
    opacity: 1;
  }
  .empty-hint {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 20px 0;
  }
</style>
</head>
<body>
<div class="app">
  <h1>🍅 뽀모도로 &amp; 할 일</h1>

  <div class="timer-card" id="timerCard">
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="focus" data-min="25">집중 25</button>
      <button class="mode-tab" data-mode="short" data-min="5">짧은 휴식 5</button>
      <button class="mode-tab" data-mode="long" data-min="15">긴 휴식 15</button>
    </div>
    <div class="time-display" id="timeDisplay">25:00</div>
    <div class="controls">
      <button class="btn btn-primary" id="startBtn">시작</button>
      <button class="btn btn-secondary" id="resetBtn">리셋</button>
    </div>
    <div class="session-count" id="sessionCount">오늘 완료한 집중 세션: 0</div>
  </div>

  <div class="todo-card">
    <h2>할 일 목록</h2>
    <div class="todo-input-row">
      <input type="text" id="todoInput" placeholder="할 일을 입력하고 Enter">
      <button id="addBtn">＋</button>
    </div>
    <ul class="todo-list" id="todoList"></ul>
    <div class="empty-hint" id="emptyHint">할 일을 추가해보세요</div>
  </div>
</div>

<script>
(function() {
  let memoryStore = {};
  const storage = {
    getItem(key) {
      try { return localStorage.getItem(key); }
      catch(e) { return Object.prototype.hasOwnProperty.call(memoryStore, key) ? memoryStore[key] : null; }
    },
    setItem(key, value) {
      try { localStorage.setItem(key, value); }
      catch(e) { memoryStore[key] = value; }
    }
  };

  const DURATIONS = { focus: 25*60, short: 5*60, long: 15*60 };
  let currentMode = 'focus';
  let remaining = DURATIONS.focus;
  let timerId = null;
  let running = false;

  const timeDisplay = document.getElementById('timeDisplay');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const timerCard = document.getElementById('timerCard');
  const sessionCountEl = document.getElementById('sessionCount');
  const modeTabs = document.querySelectorAll('.mode-tab');

  function fmt(s) {
    const m = Math.floor(s/60).toString().padStart(2,'0');
    const sec = (s%60).toString().padStart(2,'0');
    return m+':'+sec;
  }

  function loadState() {
    try {
      const today = new Date().toISOString().slice(0,10);
      const raw = JSON.parse(storage.getItem('pomo_sessions') || '{}');
      return raw.date === today ? raw.count : 0;
    } catch(e) { return 0; }
  }
  function saveSession() {
    const today = new Date().toISOString().slice(0,10);
    const count = loadState() + 1;
    storage.setItem('pomo_sessions', JSON.stringify({date: today, count}));
    renderSessionCount();
  }
  function renderSessionCount() {
    sessionCountEl.textContent = `오늘 완료한 집중 세션: ${loadState()}`;
  }

  function switchMode(mode, min) {
    running = false;
    clearInterval(timerId);
    startBtn.textContent = '시작';
    currentMode = mode;
    remaining = min*60;
    timeDisplay.textContent = fmt(remaining);
    modeTabs.forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
  }

  modeTabs.forEach(tab => {
    tab.addEventListener('click', () => switchMode(tab.dataset.mode, Number(tab.dataset.min)));
  });

  function tick() {
    remaining--;
    timeDisplay.textContent = fmt(remaining);
    if (remaining <= 0) {
      clearInterval(timerId);
      running = false;
      startBtn.textContent = '시작';
      if (currentMode === 'focus') saveSession();
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = 880;
        g.gain.setValueAtTime(0.15, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
        o.start(); o.stop(ctx.currentTime + 0.6);
      } catch(e) {}
    }
  }

  startBtn.addEventListener('click', () => {
    if (running) {
      running = false;
      clearInterval(timerId);
      startBtn.textContent = '시작';
    } else {
      running = true;
      startBtn.textContent = '일시정지';
      timerId = setInterval(tick, 1000);
    }
  });

  resetBtn.addEventListener('click', () => {
    const activeTab = document.querySelector('.mode-tab.active');
    switchMode(activeTab.dataset.mode, Number(activeTab.dataset.min));
  });

  renderSessionCount();

  // Todo list
  const todoInput = document.getElementById('todoInput');
  const addBtn = document.getElementById('addBtn');
  const todoList = document.getElementById('todoList');
  const emptyHint = document.getElementById('emptyHint');

  function loadTodos() {
    try { return JSON.parse(storage.getItem('pomo_todos') || '[]'); }
    catch(e) { return []; }
  }
  function saveTodos(todos) {
    storage.setItem('pomo_todos', JSON.stringify(todos));
  }

  function renderTodos() {
    const todos = loadTodos();
    todoList.innerHTML = '';
    emptyHint.style.display = todos.length ? 'none' : 'block';
    todos.forEach((todo, idx) => {
      const li = document.createElement('li');
      li.className = 'todo-item' + (todo.done ? ' done' : '');
      li.innerHTML = `
        <input type="checkbox" ${todo.done ? 'checked' : ''} data-idx="${idx}">
        <span class="label" data-idx="${idx}">${escapeHtml(todo.text)}</span>
        <button class="del-btn" data-idx="${idx}">×</button>
      `;
      todoList.appendChild(li);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function addTodo() {
    const text = todoInput.value.trim();
    if (!text) return;
    const todos = loadTodos();
    todos.push({ text, done: false });
    saveTodos(todos);
    todoInput.value = '';
    renderTodos();
  }

  addBtn.addEventListener('click', addTodo);
  todoInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') addTodo();
  });

  todoList.addEventListener('click', e => {
    const idx = e.target.dataset.idx;
    if (idx === undefined) return;
    const todos = loadTodos();
    if (e.target.classList.contains('del-btn')) {
      todos.splice(idx, 1);
    } else if (e.target.matches('input[type="checkbox"]') || e.target.classList.contains('label')) {
      todos[idx].done = !todos[idx].done;
    }
    saveTodos(todos);
    renderTodos();
  });

  renderTodos();
})();
</script>
</body>
</html>
