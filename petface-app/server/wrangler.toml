name = "petface-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Create with: npx wrangler kv namespace create QUOTA  (then paste the id below)
[[kv_namespaces]]
binding = "QUOTA"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
CLAUDE_MODEL = "claude-opus-5-5"
CLAUDE_EFFORT = "low"
FREE_DAILY_LIMIT = "3"
PREMIUM_DAILY_LIMIT = "30"
AD_BONUS_MAX = "2"
IP_DAILY_LIMIT = "20"
GLOBAL_DAILY_LIMIT = "5000"
PREMIUM_ENTITLEMENT_ID = "premium"

# Secrets (never commit these) - set with:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put REVENUECAT_SECRET_KEY
#   npx wrangler secret put APP_KEY
